<style>
/* Layout: one narrow reading column on an ink-dark night; a red-seal "portrait" for each character; result reads top to bottom like a scroll. Single dark look by choice. */
:root {
  --ink: #14121b;
  --panel: #211d2b;
  --line: #3a3448;
  --paper: #efe6d2;
  --dim: #a89f8c;
  --gold: #d9b45b;
  --display: "Song Myung", "Gowun Batang", "Apple SD Gothic Neo", serif;
  --body: "Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(217, 180, 91, 0.12), transparent 55%),
    radial-gradient(ellipse at 80% 110%, rgba(120, 90, 160, 0.14), transparent 50%),
    var(--ink);
  background-attachment: fixed;
  color: var(--paper);
  font-family: var(--body);
  line-height: 1.75;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 720px; margin: 0 auto; box-sizing: border-box; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.25; text-wrap: balance; margin: 0; }
.eyebrow { color: var(--gold); letter-spacing: 0.3em; font-size: 12px; }
.small { color: var(--dim); font-size: 14px; }
button { font-family: var(--body); }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 15px 18px; font-size: 18px; cursor: pointer; background: var(--gold); color: #241a05; font-weight: 700; width: 100%; }
.btn.lucky { background: linear-gradient(135deg, #fff1a8, #ffc23a); color: #3a2400; box-shadow: 0 0 20px rgba(255, 210, 90, 0.45); animation: luckyGlow 1.4s ease-in-out infinite; }
@keyframes luckyGlow { 50% { transform: scale(1.02); } }
@media (prefers-reduced-motion: reduce) { .btn.lucky { animation: none; } }
.btn.ghost { background: transparent; color: var(--paper); border: 1px solid var(--line); font-weight: 400; }

/* intro */
.intro { min-height: calc(100vh - 84px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.intro h1 { font-size: clamp(40px, 10vw, 68px); }
.intro .sub { font-family: var(--display); color: var(--gold); font-size: clamp(20px, 4.5vw, 28px); }
.credit { color: var(--dim); }
.credit b { color: var(--gold); font-weight: 400; font-family: var(--display); font-size: 1.1em; }
.lede { font-size: 17px; max-width: 60ch; }
.disclaimer { color: var(--dim); font-size: 14px; border-left: 2px solid rgba(217,180,91,0.4); padding-left: 12px; margin: 0; max-width: 62ch; }
.seals { display: flex; gap: 8px; flex-wrap: wrap; }
.seal { display: grid; place-items: center; font-family: var(--display); color: #fff3e0; border-radius: 12px; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.22), 0 8px 24px rgba(0,0,0,0.5); flex: none; }
.seals .seal { width: 40px; height: 40px; font-size: 22px; border-radius: 8px; opacity: 0.85; }

/* question */
.progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 22px; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width 0.3s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
.qcard { background: var(--panel); border: 1px solid rgba(217,180,91,0.22); border-radius: 18px; padding: 22px 22px 20px; margin-bottom: 16px; }
.qcard h2 { font-size: clamp(26px, 6vw, 34px); margin: 6px 0 10px; }
.qcard .situation { font-size: 18px; margin: 0 0 8px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { appearance: none; text-align: left; display: flex; gap: 12px; align-items: baseline; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: var(--paper); border-radius: 14px; padding: 14px 16px; font-size: 17px; line-height: 1.6; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.15s; }
.opt b { font-family: var(--display); color: var(--gold); font-weight: 400; font-size: 19px; }
.opt:hover { border-color: rgba(217,180,91,0.6); }
.opt.on { background: rgba(217,180,91,0.16); border-color: var(--gold); }
.opt:active { transform: scale(0.99); }
.qnav { display: flex; justify-content: space-between; margin-top: 16px; }
.linkbtn { appearance: none; background: none; border: 0; color: var(--dim); font-size: 15px; cursor: pointer; padding: 8px 0; }
.fade { animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }

/* result */
.hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 14px 0 6px; }
.hero .seal { width: 120px; height: 120px; font-size: 70px; border-radius: 16px; transform: rotate(-4deg); animation: stamp 0.7s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes stamp { from { transform: rotate(-20deg) scale(1.8); opacity: 0; } }
.hero h1 { font-size: clamp(34px, 8vw, 50px); }
.meta { color: var(--dim); }
.quote { font-family: var(--display); color: var(--gold); font-size: clamp(20px, 4.6vw, 26px); margin: 20px 0 6px; }
section.block { margin-top: 34px; }
section.block > h2 { font-size: 26px; margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
section.block > h2 small { font-family: var(--body); font-size: 13px; color: var(--dim); letter-spacing: 0.05em; }
.story p { font-size: 18px; margin: 0 0 14px; max-width: 64ch; }
.facts { display: grid; gap: 8px; margin-top: 8px; }
.fact { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: baseline; }
.fact span:first-child { color: var(--gold); font-size: 13px; border: 1px solid rgba(217,180,91,0.45); border-radius: 999px; text-align: center; padding: 1px 0; }
.personal p { margin: 0 0 10px; }
.conflict { background: var(--panel); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; border-left: 3px solid var(--gold); }
.conflict h3 { font-size: 20px; margin-bottom: 6px; }
.conflict .ev { color: var(--dim); font-size: 14px; margin-top: 8px; }
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 560px) { .profile { grid-template-columns: 1fr; } }
.radar { width: 100%; max-width: 340px; margin: 0 auto; display: block; }
.bars { display: grid; gap: 10px; }
.bar .top { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar .track { height: 8px; background: var(--line); border-radius: 999px; position: relative; overflow: hidden; }
.bar .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 999px; }
.bar .track em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #b9b0d0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--dim); justify-content: center; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }
details { background: var(--panel); border-radius: 14px; padding: 4px 18px; margin-bottom: 10px; }
summary { cursor: pointer; padding: 12px 0; font-family: var(--display); font-size: 19px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--gold); font-family: var(--body); }
details[open] summary::after { content: "－"; }
details .inner { padding-bottom: 14px; }
details .inner p { margin: 0 0 8px; }
details .inner b { color: var(--gold); font-weight: 400; }
.refs { color: var(--dim); font-size: 13px; }
.evidence h3 { font-size: 19px; margin: 14px 0 6px; }
.evidence ul { margin: 0; padding-left: 20px; }
.evidence li { margin-bottom: 4px; }
.alt { margin-bottom: 14px; }
.alt .top { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.alt .track { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 4px 0; }
.alt .track i { display: block; height: 100%; background: linear-gradient(90deg, #8f86a8, var(--gold)); }
.cotop { background: rgba(217,180,91,0.12); border: 1px solid rgba(217,180,91,0.4); border-radius: 12px; padding: 10px 14px; margin-top: 14px; font-size: 15px; }
.share { background: linear-gradient(140deg, #2b2338, #1b1824); border: 1px solid rgba(217,180,91,0.4); border-radius: 18px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.share .seal { width: 84px; height: 84px; font-size: 48px; margin-bottom: 6px; }
.share h3 { font-size: 30px; }
.actions { display: grid; gap: 10px; margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.history { display: grid; gap: 8px; }
.history h3 { font-size: 20px; }
.hist { appearance: none; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; color: var(--paper); cursor: pointer; font-size: 16px; }
.hist .seal { width: 36px; height: 36px; font-size: 20px; border-radius: 8px; }
.hist small { display: block; color: var(--dim); font-size: 13px; }
.linkbanner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: rgba(217,180,91,0.12); border: 1px solid rgba(217,180,91,0.45); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.linkbanner .btn { width: auto; padding: 10px 16px; font-size: 16px; }
.kakao { background: #fee500; color: #191600; }
.share-text { width: 100%; box-sizing: border-box; font: 14px var(--body); background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: none; }
@media (prefers-reduced-motion: reduce) { .fade, .hero .seal { animation: none; } }
</style>
</head>

<script>
// JavaScript port of engine/scoring.py, engine/inference.py and engine/narrative.py.
// tests/test_web_parity.py checks that it gives the same results as the Python engine.
(function (root) {
  "use strict";
  const DIMS = ["J", "C", "K", "B", "R", "F"];
  const dimIndex = (d) => DIMS.indexOf(d);

  function questionMap(Q) {
    const m = {};
    for (const q of Q.questions) m[q.id] = q;
    return m;
  }
  function chosenOption(q, oid) {
    const o = q.options.find((x) => x.id === oid);
    if (!o) throw new Error(q.id + " has no option " + oid);
    return o;
  }
  function rawScores(Q, answers) {
    const qm = questionMap(Q), total = {};
    for (const d of DIMS) total[d] = 0;
    for (const qid of Object.keys(answers)) {
      const o = chosenOption(qm[qid], answers[qid]);
      for (const d of DIMS) total[d] += o.scores[d];
    }
    return total;
  }
  function scoreBounds(Q) {
    const lo = {}, hi = {};
    for (const d of DIMS) { lo[d] = 0; hi[d] = 0; }
    for (const q of Q.questions) {
      for (const d of DIMS) {
        const vals = q.options.map((o) => o.scores[d]);
        lo[d] += Math.min(...vals);
        hi[d] += Math.max(...vals);
      }
    }
    return [lo, hi];
  }
  function normalize(raw, bounds) {
    const [lo, hi] = bounds, out = {};
    for (const d of DIMS) {
      const span = hi[d] - lo[d];
      out[d] = span === 0 ? 0 : ((raw[d] - lo[d]) * 100) / span;
    }
    return out;
  }
  function stanceCounts(Q, answers) {
    const qm = questionMap(Q), c = {};
    for (const qid of Object.keys(answers)) {
      const s = chosenOption(qm[qid], answers[qid]).stance;
      if (s) c[s] = (c[s] || 0) + 1;
    }
    return c;
  }
  function tagHits(Q, answers) {
    const qm = questionMap(Q), hits = {};
    for (const qid of Q.display_order) {
      if (!(qid in answers)) continue;
      for (const t of chosenOption(qm[qid], answers[qid]).tags || []) (hits[t] = hits[t] || []).push(qid);
    }
    return hits;
  }
  function contributions(Q, answers, dim) {
    const qm = questionMap(Q), order = {};
    Q.display_order.forEach((qid, i) => { order[qid] = i; });
    const rows = Object.keys(answers).map((qid) => [qid, answers[qid], chosenOption(qm[qid], answers[qid]).scores[dim]]);
    rows.sort((a, b) => b[2] - a[2] || order[a[0]] - order[b[0]]);
    return rows;
  }

  function distance(p, t, alpha) {
    let s = 0;
    for (const d of DIMS) s += alpha[d] * (p[d] - t[d]) ** 2;
    return Math.sqrt(s);
  }
  function rank(prof, C) {
    const rows = C.characters.map((ch, i) => {
      const dist = distance(prof, ch.target, C.alpha);
      return { id: ch.id, distance: dist, resonance: Math.max(0, 100 - dist), order: i };
    });
    rows.sort((a, b) => a.distance - b.distance || a.order - b.order);
    return rows;
  }
  function coTop(ranked, margin) {
    const best = ranked[0].distance;
    return ranked.filter((r) => r.distance - best < margin).map((r) => r.id);
  }

  function hasBatchim(word) {
    const w = word.trim();
    const code = w.charCodeAt(w.length - 1) - 0xac00;
    return code >= 0 && code <= 11171 && code % 28 !== 0;
  }
  function averageProfile(Q) {
    const [lo, hi] = scoreBounds(Q), out = {};
    for (const d of DIMS) {
      let avg = 0;
      for (const q of Q.questions) avg += q.options.reduce((a, o) => a + o.scores[d], 0) / q.options.length;
      out[d] = ((avg - lo[d]) * 100) / (hi[d] - lo[d]);
    }
    return out;
  }
  const fmt = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

  function buildResult(Q, C, P, answers) {
    const qm = questionMap(Q);
    const dimName = {};
    for (const d of Q.dimensions) dimName[d.id] = d.name;
    const chars = {};
    for (const c of C.characters) chars[c.id] = c;
    const entries = {};
    for (const e of P.entries) entries[e.id] = e;

    const raw = rawScores(Q, answers);
    const prof = normalize(raw, scoreBounds(Q));
    const ranked = rank(prof, C);
    const top = chars[ranked[0].id];
    const name = top.name;

    const byStrength = DIMS.slice().sort((a, b) => prof[b] - prof[a] || dimIndex(a) - dimIndex(b));
    const topDim = byStrength[0], lowDim = byStrength[DIMS.length - 1];
    const lines = C.dimension_lines;
    const personal = [fmt(lines.top[topDim], { name }), fmt(lines.low, { dim: dimName[lowDim] })];

    const hits = tagHits(Q, answers);
    const found = [];
    P.conflicts.forEach((rule, i) => {
      const a = hits[rule.a] || [], b = hits[rule.b] || [];
      if (a.length && b.length) found.push([-(a.length + b.length), i, rule, a[0], b[0]]);
    });
    found.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
    const ev = (qid) => ({ qid, title: qm[qid].title, choice: chosenOption(qm[qid], answers[qid]).text });
    const conflicts = found.slice(0, 2).map(([, , rule, qa, qb]) => ({
      id: rule.id, title: rule.title, text: fmt(rule.text, { name }), evidence: [ev(qa), ev(qb)]
    }));

    const counts = stanceCounts(Q, answers);
    const stanceOrder = Object.keys(P.stances);
    const stances = Object.keys(counts)
      .sort((a, b) => counts[b] - counts[a] || stanceOrder.indexOf(a) - stanceOrder.indexOf(b))
      .slice(0, 2)
      .map((s) => ({ id: s, label: P.stances[s].label, count: counts[s], entry: entries[P.stances[s].entry] }));

    let identity = null;
    for (const q of Q.questions) {
      if (q.theme === "identity" && q.id in answers) {
        const lens = chosenOption(q, answers[q.id]).lens;
        if (lens in P.lenses) {
          identity = { lens, text: P.lenses[lens].text, entry: entries[P.lenses[lens].entry] };
          break;
        }
      }
    }

    const avg = averageProfile(Q);
    let lean = DIMS.slice().sort((a, b) => (top.target[b] - avg[b]) - (top.target[a] - avg[a]) || dimIndex(a) - dimIndex(b));
    if (DIMS.every((d) => Math.abs(top.target[d] - avg[d]) < 1)) lean = byStrength;
    const evidence = lean.slice(0, 2).map((d) => ({
      dim: d, dim_name: dimName[d], score: prof[d],
      answers: contributions(Q, answers, d).filter((r) => r[2] > 0).slice(0, 3)
        .map(([qid, oid, pts]) => ({ qid, title: qm[qid].title, choice: chosenOption(qm[qid], oid).text, points: pts }))
    }));

    const alternatives = ranked.slice(1, 3).map((r) => {
      const alt = chars[r.id];
      let d = DIMS[0], best = -1;
      for (const x of DIMS) {
        const diff = Math.abs(alt.target[x] - top.target[x]);
        if (diff > best) { best = diff; d = x; }
      }
      const more = alt.target[d] > top.target[d];
      return {
        id: alt.id, name: alt.name, resonance: r.resonance,
        why: "'" + dimName[d] + (hasBatchim(dimName[d]) ? "'을" : "'를") + " 조금 " + (more ? "더" : "덜") +
          " 중시하는 쪽으로 답했다면 '" + alt.name + "'에 더 가까웠을 거예요."
      };
    });

    const tops = stances.length ? stances[0].label : "균형 잡힌 판단";
    const karma = "업의 관점에서 다시 읽으면, 이어지는 것은 '" + name + (hasBatchim(name) ? "'이라는" : "'라는") +
      " 자아가 아니라 '" + top.karma + "'는 행위의 흐름이다. 당신의 응답에서 가장 자주 나온 판단은 '" + tops +
      "'이었다. 그 행위가 어디로 이어질지는 이제부터의 선택에 달려 있다.";
    const echo = top.plato_echo + ", 플라톤식으로 말해 영혼이 오래전에 알던 것을 '상기'하는 순간이라고 상상해 볼 수 있다. 물론 이것은 이야기를 위한 장치일 뿐이다.";

    return {
      data_version: Q.version, raw, profile: prof, ranking: ranked, co_top: coTop(ranked, C.tie_margin),
      character: top, personal, conflicts, stances, identity,
      caveat: entries[P.caveat_entry], karma, echo, evidence, alternatives, disclaimer: P.disclaimer,
      share: "나의 전생은 「" + name + "」 — " + top.summary + ". (" + top.era + ", " + top.region + ")"
    };
  }

  const api = { DIMS, rawScores, scoreBounds, normalize, rank, coTop, buildResult };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PastLife = api;
})(this);

</script>
<script>
(() => {
  "use strict";
  const { questions: Q, characters: C, philosophy: P } = DATA;
  const E = window.PastLife;
  const app = document.getElementById("app");
  const qmap = Object.fromEntries(Q.questions.map((q) => [q.id, q]));
  const order = Q.display_order.map((id) => qmap[id]);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = sessionStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let answers = store.get("pl_answers", {});
  let idx = 0;

  // A result is the 20 answers in display order (e.g. ABDC…). It travels in the link as #r-ABDC…
  // so a link sent to yourself or a friend reopens the very same result.
  const ARTIFACT_URL = "https://bellhkim.github.io/past_life_game/web/";
  function testUrl() {
    const host = location.hostname || "";
    return /^https?:$/.test(location.protocol) && !/claude/.test(host) ? location.href.split("#")[0] : ARTIFACT_URL;
  }
  const encode = (a) => order.map((q) => a[q.id] || "").join("");
  function decode(code) {
    if (!/^[ABCD]{20}$/.test(code || "")) return null;
    const a = {};
    order.forEach((q, i) => { a[q.id] = code[i]; });
    return a;
  }
  const resultUrl = (a) => testUrl() + "#r-" + encode(a);
  const saved = {
    list() { try { return JSON.parse(localStorage.getItem("pl_history") || "[]"); } catch (e) { return []; } },
    add(code, ch) {
      const list = this.list().filter((x) => x.code !== code);
      list.unshift({ code, id: ch.id, at: Date.now() });
      try { localStorage.setItem("pl_history", JSON.stringify(list.slice(0, 10))); } catch (e) {}
    }
  };
  const fmtDate = (t) => { const d = new Date(t); return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate(); };

  function intro() {
    app.innerHTML =
      '<div class="intro fade">' +
      '<div class="eyebrow">PAST LIFE · PHILOSOPHY</div>' +
      "<h1>나의 전생은<br>누구였을까</h1>" +
      '<div class="sub">철학이 밝혀내는 또 하나의 나</div>' +
      '<div class="credit">만든 사람 · <b>김종현</b></div>' +
      '<p class="lede">권력, 정의, 생존, 충성, 자유, 희생에 관한 <b>' + order.length + "개의 딜레마</b>에 답해 주세요. 정답은 없습니다. 당신의 선택에서 드러난 판단의 결을 여섯 갈래로 읽고, 가장 닮은 가상의 인물과 그의 삶을 들려드립니다.</p>" +
      '<div class="seals" aria-hidden="true">' + C.characters.map((c) => '<span class="seal" style="background:' + c.color + '">' + esc(c.seal) + "</span>").join("") + "</div>" +
      '<p class="disclaimer">' + esc(P.disclaimer) + "</p>" +
      '<button class="btn" id="start">첫 번째 딜레마로</button>' +
      '<button class="btn ghost" id="quitApp">끝내기</button>' +
      (Object.keys(answers).length && Object.keys(answers).length < order.length ? '<button class="btn ghost" id="resume">이어서 하기 (' + Object.keys(answers).length + "/" + order.length + ")</button>" : "") +
      pastHTML() +
      "</div>";
    document.getElementById("start").onclick = () => { if (window.appShell) appShell.enter(); answers = {}; store.set("pl_answers", answers); idx = 0; question(); };
    document.getElementById("quitApp").onclick = () => { askFeedback(); if (window.appShell) appShell.leaveApp(); };
    const r = document.getElementById("resume");
    if (r) r.onclick = () => { if (window.appShell) appShell.enter(); idx = order.findIndex((q) => !(q.id in answers)); question(); };
    app.querySelectorAll(".hist").forEach((b) => b.addEventListener("click", () => {
      const a = decode(b.dataset.code);
      if (a) { answers = a; result("saved"); }
    }));
    if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; } }
  }

  function pastHTML() {
    const chars = Object.fromEntries(C.characters.map((c) => [c.id, c]));
    const list = saved.list().filter((x) => chars[x.id] && decode(x.code)).slice(0, 5);
    if (!list.length) return "";
    return '<div class="history"><h3>지난 결과</h3>' + list.map((x) => {
      const c = chars[x.id];
      return '<button class="hist" data-code="' + x.code + '"><span class="seal" style="background:' + c.color + '">' + esc(c.seal) + "</span><span>" + esc(c.name) + "<small>" + fmtDate(x.at) + "</small></span></button>";
    }).join("") + "</div>";
  }

  function question() {
    const q = order[idx];
    app.innerHTML =
      '<div class="qhead"><span>문항 ' + String(idx + 1).padStart(2, "0") + " · " + esc(Q.themes[q.theme]) + "</span><span>" + (idx + 1) + " / " + order.length + "</span></div>" +
      '<div class="progress"><i style="width:' + (idx / order.length) * 100 + '%"></i></div>' +
      '<div class="fade"><div class="qcard"><h2>' + esc(q.title) + '</h2><p class="situation">' + esc(q.situation) + '</p><div class="small">' + esc(q.prompt) + "</div></div>" +

      q.options.map((o) => '<button class="opt' + (answers[q.id] === o.id ? " on" : "") + '" data-o="' + o.id + '"><b>' + o.id + "</b><span>" + esc(o.text) + "</span></button>").join("") +
      "</div>" +
      '<div class="qnav">' + (idx > 0 ? '<button class="linkbtn" id="back">← 이전 문항</button>' : "<span></span>") + '<button class="linkbtn" id="home">✕ 끝내기</button></div></div>';
    app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      answers[q.id] = b.dataset.o;
      store.set("pl_answers", answers);
      app.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === b));
      setTimeout(() => {
        if (idx + 1 < order.length) { idx++; question(); }
        else result();
      }, 220);
    }));
    const back = document.getElementById("back");
    if (back) back.onclick = () => { idx--; question(); };
    document.getElementById("home").onclick = () => { if (window.appShell) appShell.exit(); intro(); askFeedback(); };
    window.scrollTo(0, 0);
    const first = app.querySelector(".opt.on") || app.querySelector(".opt");
    if (first) first.focus({ preventScroll: true });
  }

  function radarSVG(prof, target) {
    const cx = 160, cy = 150, R = 110;
    const pt = (i, v) => {
      const a = -Math.PI / 2 + (i * Math.PI) / 3;
      return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100];
    };
    const poly = (vals) => vals.map((v, i) => pt(i, v).map((n) => n.toFixed(1)).join(",")).join(" ");
    let s = '<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="판단 프로필 육각형 그래프">';
    for (const lv of [25, 50, 75, 100]) s += '<polygon points="' + poly(Array(6).fill(lv)) + '" fill="none" stroke="#3a3448" stroke-width="1"/>';
    E.DIMS.forEach((d, i) => {
      const [x, y] = pt(i, 100), [lx, ly] = pt(i, 122);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#3a3448"/>';
      const name = Q.dimensions[i].name.split("와 ")[0].split("과 ")[0];
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" fill="#efe6d2" font-size="13" text-anchor="middle" font-family="Gowun Batang, serif">' + esc(name) + "</text>";
    });
    s += '<polygon points="' + poly(E.DIMS.map((d) => target[d])) + '" fill="rgba(143,134,168,0.15)" stroke="#b9b0d0" stroke-width="1.5" stroke-dasharray="4 3"/>';
    s += '<polygon points="' + poly(E.DIMS.map((d) => prof[d])) + '" fill="rgba(217,180,91,0.28)" stroke="#d9b45b" stroke-width="2.5"/>';
    E.DIMS.forEach((d, i) => { const [x, y] = pt(i, prof[d]); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="#d9b45b"/>'; });
    return s + "</svg>";
  }

  function entryHTML(e) {
    return "<p><b>핵심 논점</b> · " + esc(e.core) + "</p><p><b>논증</b> · " + esc(e.argument) + "</p><p><b>반론</b> · " + esc(e.counter) + "</p><p><b>이 게임에서의 쓰임</b> · " + esc(e.game_use) + '</p><p class="refs">참고: ' + e.references.map(esc).join(" / ") + "</p>";
  }

  // from: "play" (just finished), "link" (opened from a shared link) or "saved" (from the list of past results)
  function result(from = "play") {
    const r = E.buildResult(Q, C, P, answers);
    const ch = r.character;
    const chars = Object.fromEntries(C.characters.map((c) => [c.id, c]));
    const code = encode(answers);
    if (from === "play") { saved.add(code, ch); store.set("pl_answers", {}); }
    if (location.hash !== "#r-" + code) location.hash = "r-" + code;
    const blocks = [];
    if (from === "link") blocks.push('<div class="linkbanner"><span>링크로 열어 본 전생 결과예요. 당신의 전생도 궁금하지 않나요?</span><button class="btn" id="tryBtn">나도 테스트하기</button></div>');
    blocks.push(
      '<div class="eyebrow">가상 인물 · 가상 생애 · 철학적 추론 결과</div>' +
      '<div class="hero"><div class="seal" style="background:' + ch.color + '">' + esc(ch.seal) + '</div><div><div class="small">당신의 전생은</div><h1>' + esc(ch.name) + " " + ch.emoji + '</h1><div class="meta">' + esc(ch.era) + " · " + esc(ch.region) + '</div><div class="meta">' + esc(ch.occupation) + "</div></div></div>" +
      (r.co_top.length > 1 ? '<div class="cotop">판단 프로필이 ' + r.co_top.slice(1).map((id) => "'" + esc(chars[id].name) + "'").join(", ") + "와도 거의 같은 거리에 있어요. 두 삶이 겹쳐 보이는 결과예요.</div>" : "") +
      '<div class="quote">“' + esc(ch.quote) + "”</div>"
    );
    blocks.push('<section class="block"><h2>당신의 전생 이야기</h2><div class="story">' + ch.story.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div>" +
      '<div class="facts"><div class="fact"><span>삶의 방식</span><span>' + esc(ch.life) + '</span></div><div class="fact"><span>핵심 사건</span><span>' + esc(ch.key_event) + '</span></div><div class="fact"><span>삶의 갈등</span><span>' + esc(ch.conflict) + "</span></div></div>" +
      '<div class="personal" style="margin-top:16px">' + r.personal.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div></section>");
    if (r.conflicts.length) {
      blocks.push('<section class="block"><h2>선택 사이의 충돌 <small>감점이 아니라 내적 갈등으로 읽습니다</small></h2>' +
        r.conflicts.map((c) => '<div class="conflict"><h3>' + esc(c.title) + "</h3><div>" + esc(c.text) + '</div><div class="ev">' + c.evidence.map((e) => "「" + esc(e.title) + "」 " + esc(e.choice)).join(" ↔ ") + "</div></div>").join("") + "</section>");
    }
    blocks.push('<section class="block"><h2>판단 프로필</h2><div class="profile"><div>' + radarSVG(r.profile, ch.target) +
      '<div class="legend"><span style="--c:#d9b45b">나의 응답</span><span style="--c:#b9b0d0">' + esc(ch.name) + ' 기준</span></div></div><div class="bars">' +
      Q.dimensions.map((d) => '<div class="bar"><div class="top"><span>' + esc(d.name) + "</span><span>" + Math.round(r.profile[d.id]) + '</span></div><div class="track"><i style="width:' + r.profile[d.id] + '%"></i><em style="left:' + ch.target[d.id] + '%"></em></div></div>').join("") +
      '</div></div><p class="small">0~100은 이 게임의 문항 안에서 가능한 최저·최고 합계 사이의 위치예요. 막대 위의 세로선은 인물의 기준값이에요. 심리적 특성의 절대적인 강도가 아닙니다.</p></section>');
    blocks.push('<section class="block"><h2>철학적 해석</h2><p class="disclaimer" style="margin-bottom:12px">' + esc(r.disclaimer) + "</p>" +
      r.stances.map((s, i) => "<details" + (i === 0 ? " open" : "") + "><summary>" + esc(s.label) + " · " + s.count + "번</summary><div class=\"inner\"><p>당신의 응답 중 " + s.count + "개가 이 경향으로 분류되었어요. 관련된 논의는 <b>" + esc(s.entry.name) + "</b>예요. 그렇다고 당신이 이 사상을 따르는 사람이라는 뜻은 아니에요.</p>" + entryHTML(s.entry) + "</div></details>").join("") +
      (r.identity ? "<details><summary>기억과 정체성</summary><div class=\"inner\"><p>" + esc(r.identity.text) + "</p>" + entryHTML(r.identity.entry) + "</div></details>" : "") +
      "<details><summary>업의 관점에서 다시 읽기</summary><div class=\"inner\"><p>" + esc(r.karma) + "</p></div></details>" +
      "<details><summary>어쩐지 낯익다면</summary><div class=\"inner\"><p>" + esc(r.echo) + "</p></div></details>" +
      "<details><summary>이 결과를 믿어도 될까</summary><div class=\"inner\"><p>스무 개의 응답으로 만든 점수가 고정된 '당신'을 확정할 수는 없어요. 다른 날, 다른 기분으로 답하면 다른 인물이 나올 수 있어요.</p>" + entryHTML(r.caveat) + "</div></details></section>");
    blocks.push('<section class="block evidence"><h2>추론 근거</h2>' + r.evidence.map((ev) => "<h3>" + esc(ev.dim_name) + " " + Math.round(ev.score) + ' <span class="small">— \'' + esc(ch.name) + "'의 두드러진 결</span></h3>" +
      (ev.answers.length ? "<ul>" + ev.answers.map((a) => "<li>「" + esc(a.title) + "」 " + esc(a.choice) + ' <span class="small">(+' + a.points + ")</span></li>").join("") + "</ul>" : '<p class="small">이 차원에 점수를 더한 응답은 없었어요.</p>')).join("") + "</section>");
    const bar = (nm, res) => '<div class="top"><span>' + esc(nm) + "</span><span>가까움 " + Math.round(res) + '</span></div><div class="track"><i style="width:' + res + '%"></i></div>';
    blocks.push('<section class="block"><h2>다른 가능성</h2><div class="alt">' + bar(ch.name, r.ranking[0].resonance) + "</div>" +
      r.alternatives.map((a) => '<div class="alt">' + bar(a.name, a.resonance) + '<div class="small">' + esc(a.why) + "</div></div>").join("") +
      '<p class="small">가까움은 100에서 판단 프로필 사이의 거리를 뺀 값이에요. 전생일 확률이 아닙니다.</p></section>');
    blocks.push('<section class="block"><h2>공유 카드</h2><div class="share"><div class="seal" style="background:' + ch.color + '">' + esc(ch.seal) + '</div><div class="small">나의 전생은</div><h3>' + esc(ch.name) + '</h3><div class="quote" style="margin:4px 0 6px;font-size:20px">' + esc(ch.summary) + '</div><div class="small">' + esc(ch.era) + " · 나의 전생은 누구였을까</div></div>" +
      '<div class="actions">' + (from === "play" ? '<button class="btn lucky" id="luckyBtn">🍀 테스트 완료 보너스 · 행운 카드 열기</button>' : "") + '<button class="btn kakao" id="meBtn">카톡 나에게 보내기 (결과 저장)</button><button class="btn" id="shareBtn">친구에게 이 테스트 추천하기</button><textarea class="share-text" id="shareText" rows="5" readonly hidden></textarea><button class="btn ghost" id="again">' + (from === "link" ? "나도 테스트하기" : "처음부터 다시 하기") + "</button></div>" +
      '<p class="small">결과는 이 기기에도 저장돼서 첫 화면의 \'지난 결과\'에서 다시 볼 수 있어요. 카톡으로 보낸 결과 링크를 누르면 어느 기기에서든 같은 결과가 열려요. 공유 문구에는 이름이나 연락처 같은 개인 정보가 들어가지 않아요.</p></section>');
    app.innerHTML = '<div class="fade">' + blocks.join("") + "</div>";
    window.scrollTo(0, 0);
    const restart = () => { if (window.appShell) appShell.exit(); answers = {}; store.set("pl_answers", answers); intro(); askFeedback(); };
    document.getElementById("again").onclick = restart;
    const tryBtn = document.getElementById("tryBtn");
    if (tryBtn) tryBtn.onclick = restart;
    const link = resultUrl(answers);
    document.getElementById("meBtn").onclick = () => share(
      "📜 [나의 전생 결과 · " + fmtDate(Date.now()) + "]\n" +
      "나의 전생은 「" + ch.name + "」 " + ch.emoji + "\n" + ch.summary + " (" + ch.era + ", " + ch.region + ")\n" +
      "“" + ch.quote + "”\n\n결과 다시 보기 👉 " + link,
      "복사했어요! 카카오톡 '나와의 채팅'에 붙여 넣으면 결과가 저장돼요");
    document.getElementById("shareBtn").onclick = () => share(
      "🔮 나의 전생은 「" + ch.name + "」 " + ch.emoji + "이래!\n" + ch.summary + " (" + ch.era + ")\n\n" +
      "스무 개의 철학 딜레마로 알아보는 전생 테스트 「나의 전생은 누구였을까」\n" +
      "5분이면 끝나. 너의 전생은 누구였을지 궁금하지 않아? 👇\n" + testUrl() + "\n\n내 결과 보기 👉 " + link,
      "복사했어요! 친구에게 카톡으로 보내 보세요");
    const luckyBtn = document.getElementById("luckyBtn");
    if (luckyBtn && window.luckyCard) luckyBtn.onclick = () => { window.luckyCard.open({ game: "나의 전생은 누구였을까", reason: "테스트 완료 · 전생은 " + ch.name }); luckyBtn.remove(); };
    else if (luckyBtn) luckyBtn.remove();
    if (from === "play") { testsDone++; lastName = ch.name; }
  }

  // feedback: once per visit, when the player leaves after finishing the test at least once
  let testsDone = 0, lastName = "";
  const feedbackOpts = () => testsDone ? { game: "나의 전생은 누구였을까", context: testsDone + "번 완료 · 마지막 결과: " + lastName, accent: "#d9b45b", ink: "#241a05" } : null;
  const askFeedback = () => { if (window.gameFeedback) gameFeedback.askOnce(feedbackOpts()); };
  if (window.gameFeedback) gameFeedback.onLeave(feedbackOpts);

  let toastTimer = 0;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }
  function share(text, copiedMsg) {
    const fallback = () => {
      const ta = document.getElementById("shareText");
      ta.value = text; ta.hidden = false; ta.focus(); ta.select();
      toast("문구를 길게 눌러 복사한 뒤 카톡에 붙여넣으세요");
    };
    const copy = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(copiedMsg || "복사했어요! 카톡 대화방에 붙여넣으세요")).catch(fallback);
      else fallback();
    };
    if (navigator.share) navigator.share({ title: "나의 전생은 누구였을까", text }).catch((err) => { if (!err || err.name !== "AbortError") copy(); });
    else copy();
  }

  // used by automated tests
  window.__pl = { answer: (a) => { answers = a; result(); } };
  // a #r-… link opens that result; our own hash updates (same result) are ignored
  function route(initial) {
    const m = /^#r-([ABCD]{20})$/.exec(location.hash);
    const a = m && decode(m[1]);
    if (!a) return false;
    if (initial || encode(answers) !== m[1]) { answers = a; result("link"); }
    return true;
  }
  window.addEventListener("hashchange", () => route(false));
  if (!route(true)) intro();
})();
</script>

<script>
// Ask the player what the maker should change. Games call askOnce() when the player leaves
// (once per visit, after at least one finished game). Feedback reaches the maker through
// KakaoTalk: the phone's share sheet when the page may open it, otherwise the
// message is copied for the player to paste into the chat the game link came from.
window.gameFeedback = (() => {
  const MAKER = "김종현";
  const OPTIONS = ["😄 재미있어요", "😵 너무 어려워요", "😴 너무 쉬워요", "🐞 버그가 있어요", "✨ 기능을 추가해 주세요", "🎨 디자인을 바꿔 주세요", "📱 화면이 불편해요"];

  async function deliver(text) {
    if (navigator.share) {
      try { await navigator.share({ text }); return "shared"; }
      catch (e) { if (e && e.name === "AbortError") return "aborted"; }
    }
    try { await navigator.clipboard.writeText(text); return "copied"; } catch (e) {}
    return "manual";
  }

  function open({ game, context = "", accent = "#ff5d8f", ink = "#ffffff" }) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const ov = document.createElement("div");
      ov.className = "fb-overlay";
      ov.style.setProperty("--fb-accent", accent);
      ov.style.setProperty("--fb-ink", ink);
      ov.setAttribute("role", "dialog");
      ov.setAttribute("aria-modal", "true");
      ov.setAttribute("aria-label", MAKER + "님에게 피드백 보내기");
      const card = document.createElement("div");
      card.className = "fb-card";
      ov.appendChild(card);
      document.body.appendChild(ov);
      const close = (sent) => {
        ov.remove();
        document.removeEventListener("keydown", onKey, true);
        if (prevFocus && prevFocus.focus) try { prevFocus.focus({ preventScroll: true }); } catch (e) {}
        resolve(sent);
      };
      const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(false); } };
      document.addEventListener("keydown", onKey, true);

      function form(picked = [], memo = "") {
        card.innerHTML =
          "<h3>만든 사람 " + MAKER + "님에게 한마디</h3>" +
          "<p>게임 어땠어요? 고쳤으면 하는 점을 골라 주세요. 여러 개 골라도 돼요.</p>" +
          '<div class="fb-chips">' + OPTIONS.map((o) => '<button type="button" class="fb-chip" aria-pressed="' + picked.includes(o) + '">' + o + "</button>").join("") + "</div>" +
          '<textarea id="fbMemo" rows="3" maxlength="500" placeholder="바라는 점이나 원하는 기능을 자유롭게 적어 주세요 (안 적어도 돼요)"></textarea>' +
          '<div class="fb-btns"><button type="button" class="fb-btn fb-later">다음에 하기</button><button type="button" class="fb-btn fb-send">보내기</button></div>';
        const memoEl = card.querySelector("#fbMemo");
        memoEl.value = memo;
        const send = card.querySelector(".fb-send");
        const chosen = () => [...card.querySelectorAll('.fb-chip[aria-pressed="true"]')].map((b) => b.textContent);
        const sync = () => { send.disabled = !chosen().length && !memoEl.value.trim(); };
        card.querySelectorAll(".fb-chip").forEach((b) => b.addEventListener("click", () => {
          b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
          sync();
        }));
        memoEl.addEventListener("input", sync);
        sync();
        card.querySelector(".fb-later").addEventListener("click", () => close(false));
        send.addEventListener("click", async () => {
          const sel = chosen(), memo = memoEl.value.trim();
          const text = "[" + game + " 피드백] " + MAKER + "님께\n" +
            (sel.length ? "• " + sel.join("\n• ") + "\n" : "") +
            (memo ? "💬 " + memo + "\n" : "") +
            (context ? "(" + context + ")" : "");
          send.disabled = true;
          const how = await deliver(text.trim());
          if (how === "aborted") { form(sel, memo); return; }
          done(how, text.trim());
        });
        card.querySelector(".fb-chip").focus({ preventScroll: true });
      }

      function done(how, text) {
        const msg = how === "shared"
          ? "고마워요! 보낸 의견은 " + MAKER + "님이 다음 버전을 만들 때 참고할 거예요."
          : how === "copied"
            ? "의견을 복사했어요. 이 게임 링크를 보내 준 " + MAKER + "님과의 카톡 대화방에 붙여 넣어 보내 주세요."
            : "아래 글을 길게 눌러 복사한 뒤, 이 게임 링크를 보내 준 " + MAKER + "님과의 카톡 대화방에 보내 주세요.";
        card.innerHTML = "<h3>" + (how === "shared" ? "보냈어요!" : "거의 다 됐어요!") + "</h3><p>" + msg + "</p>" +
          '<textarea readonly rows="5"></textarea>' +
          '<div class="fb-btns"><button type="button" class="fb-btn fb-send">닫기</button></div>';
        const ta = card.querySelector("textarea");
        ta.value = text;
        if (how === "manual") { ta.focus(); ta.select(); }
        const btn = card.querySelector(".fb-send");
        btn.addEventListener("click", () => close(true));
        if (how !== "manual") btn.focus({ preventScroll: true });
      }

      form();
    });
  }

  // Once per visit and game: ask when the player leaves after finishing at least one game.
  const memo = {};
  function asked(game) {
    if (memo[game]) return true;
    try { return sessionStorage.getItem("fb_asked:" + game) === "1"; } catch (e) { return false; }
  }
  function askOnce(opts) {
    if (!opts || asked(opts.game) || document.querySelector(".fb-overlay")) return Promise.resolve(false);
    memo[opts.game] = true;
    try { sessionStorage.setItem("fb_asked:" + opts.game, "1"); } catch (e) {}
    return open(opts);
  }
  // On a computer, leaving starts with the pointer going off the top of the window (to the tab's close button).
  // getOpts returns the popup options, or null when it is not a good moment.
  function onLeave(getOpts) {
    document.addEventListener("mouseout", (e) => {
      if (e.relatedTarget || e.clientY > 0) return;
      const opts = getOpts();
      if (opts) askOnce(opts);
    });
  }
  return { open, askOnce, onLeave };
})();
</script>

<script>
// Browsers never let a page remove the address bar itself. Full screen mode hides it where the
// browser allows it (computers, Android Chrome, KakaoTalk on Android); iPhone Safari does not.
window.appShell = (() => {
  const el = document.documentElement;
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  // call from a tap (browsers only allow full screen right after a user gesture)
  function enter() {
    if (isFull()) return;
    try {
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function exit() {
    if (!isFull()) return;
    try {
      const p = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen && document.webkitExitFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  // leave the game altogether: back to the page or chat the link was opened from
  function leaveApp() {
    exit();
    const close = () => {
      if (/KAKAOTALK/i.test(navigator.userAgent)) location.href = "kakaotalk://inappbrowser/close";
      else { try { window.close(); } catch (e) {} }
    };
    if (history.length > 1) {
      history.back();
      setTimeout(() => { if (!document.hidden) close(); }, 500);
    } else close();
  }
  return { enter, exit, isFull, leaveApp };
})();
</script>

<script>
// 행운 카드: lotto/predict.json holds this week's numbers, rebuilt every Saturday from past draws.
window.luckyCard = (() => {
  const URL_ = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)
    ? new URL("../lotto/predict.json", location.href).href : "https://bellhkim.github.io/lotto/predict.json";
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  async function load() {
    try {
      const r = await fetch(URL_, { cache: "no-cache" });
      if (!r.ok) return null;
      const p = await r.json();
      return p && p.main && p.main.nums && p.main.nums.length === 6 ? p : null;
    } catch (e) { return null; }
  }
  let actx = null;
  function ding(i) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + i * 0.35, o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.setValueAtTime(660 + i * 90, t);
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  }
  // game: name for the copy text; reason: why the card was earned (e.g. "12,340점 달성")
  function open({ game, reason, muted = false }) {
    if (document.querySelector(".lk-overlay")) return;
    const ov = document.createElement("div");
    ov.className = "lk-overlay";
    ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "행운의 보너스 카드");
    ov.innerHTML = '<div class="lk-card"><h3>🍀 행운의 보너스 카드</h3><p>' + esc(reason) + "! 김종현이 준비한 이번 주 행운 번호예요.</p>" +
      '<button type="button" class="lk-reveal">카드 열기<small>눌러서 번호를 확인하세요</small></button></div>';
    document.body.appendChild(ov);
    const card = ov.querySelector(".lk-card"), reveal = ov.querySelector(".lk-reveal");
    const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
    document.addEventListener("keydown", onKey, true);
    reveal.focus({ preventScroll: true });
    reveal.addEventListener("click", async () => {
      reveal.disabled = true;
      reveal.querySelector("small").textContent = "지난 당첨 번호를 분석하는 중…";
      const p = await load();
      let nums, bonus, head, foot;
      if (p) {
        nums = p.main.nums; bonus = p.main.bonus;
        head = "제" + p.target.no + "회 (" + p.target.date.slice(5).replace("-", "/") + ") · " + esc(p.main.name);
        foot = '<p class="lk-note">' + esc(p.main.method) + "</p>" +
          '<details class="lk-sets"><summary>다른 분석 번호 보기</summary>' +
          p.sets.map((s) => '<div class="lk-set"><b>' + esc(s.name) + "</b><span>" + s.nums.join(" · ") + "</span><small>" + esc(s.method) + "</small></div>").join("") +
          "</details>" + '<p class="lk-note">' + esc(p.note) + "</p>";
      } else {
        const pool = Array.from({ length: 45 }, (_, i) => i + 1);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        nums = pool.slice(0, 6).sort((a, b) => a - b); bonus = pool[6];
        head = "김종현이 뽑아 준 행운 번호";
        foot = '<p class="lk-note">분석 자료를 불러오지 못해 무작위로 뽑았어요. 재미로만 봐 주세요.</p>';
      }
      const ball = (n, i) => '<span class="lk-ball c' + Math.min(5, Math.ceil(n / 10)) + '" style="animation-delay:' + i * 0.35 + 's">' + n + "</span>";
      card.innerHTML = "<h3>🍀 " + head + "</h3>" +
        '<div class="lk-balls">' + nums.map(ball).join("") + '<span class="lk-plus">+</span>' + ball(bonus, 6) + "</div>" + foot +
        '<textarea class="lk-text" readonly hidden></textarea>' +
        '<div class="lk-btns"><button type="button" class="lk-btn lk-close">닫기</button><button type="button" class="lk-btn lk-copy">번호 전부 복사</button></div>';
      if (!muted) for (let i = 0; i < 7; i++) ding(i);
      try {
        const list = JSON.parse(localStorage.getItem("lucky_history") || "[]");
        list.unshift({ game, nums, bonus, draw: p ? p.target.no : null, at: Date.now() });
        localStorage.setItem("lucky_history", JSON.stringify(list.slice(0, 10)));
      } catch (e) {}
      // every set on the card goes into the copy, one per line
      const site = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname) ? location.origin + "/" : "https://bellhkim.github.io/";
      const lines = ["🍀 " + game + " " + reason + " 기념 " + (p ? "제" + p.target.no + "회 (" + p.target.date + ") " : "") + "행운 번호",
        "⭐ " + (p ? p.main.name : "행운 번호") + ": " + nums.join(", ") + " + 보너스 " + bonus];
      if (p) for (const s of p.sets) lines.push("• " + s.name + ": " + s.nums.join(", ") + (s.bonus ? " + 보너스 " + s.bonus : ""));
      lines.push("(지난 당첨 기록을 재미로 분석한 번호예요. 당첨 확률은 어떤 번호든 같아요)", site);
      const text = lines.join("\n");
      card.querySelector(".lk-close").addEventListener("click", close);
      const copyBtn = card.querySelector(".lk-copy");
      const ta = card.querySelector(".lk-text");
      copyBtn.addEventListener("click", () => {
        const manual = () => { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); copyBtn.textContent = "글을 길게 눌러 복사"; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { copyBtn.textContent = "전부 복사했어요!"; }).catch(manual);
        else manual();
      });
      copyBtn.focus({ preventScroll: true });
    });
  }
  return { open };
})();
</script>
