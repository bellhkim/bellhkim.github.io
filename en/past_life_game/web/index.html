<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Was I in a Past Life?</title>
<meta name="description" content="An imagined past life read from twenty philosophical dilemmas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Who Was I in a Past Life? — another self revealed by philosophy">
<meta property="og:description" content="Answer twenty dilemmas and meet the imagined past life most like you, and hear their story.">
<meta name="theme-color" content="#14121b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow reading column on an ink-dark night; a red-seal "portrait" for each character; result reads top to bottom like a scroll. Single dark look by choice. */
:root {
  --ink: #14121b;
  --panel: #211d2b;
  --line: #3a3448;
  --paper: #efe6d2;
  --dim: #a89f8c;
  --gold: #d9b45b;
  --display: "Song Myung", "Gowun Batang", "Apple SD Gothic Neo", serif;
  --body: "Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(217, 180, 91, 0.12), transparent 55%),
    radial-gradient(ellipse at 80% 110%, rgba(120, 90, 160, 0.14), transparent 50%),
    var(--ink);
  background-attachment: fixed;
  color: var(--paper);
  font-family: var(--body);
  line-height: 1.75;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 720px; margin: 0 auto; box-sizing: border-box; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.25; text-wrap: balance; margin: 0; }
.eyebrow { color: var(--gold); letter-spacing: 0.3em; font-size: 12px; }
.small { color: var(--dim); font-size: 14px; }
button { font-family: var(--body); }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 15px 18px; font-size: 18px; cursor: pointer; background: var(--gold); color: #241a05; font-weight: 700; width: 100%; }
.btn.lucky { background: linear-gradient(135deg, #fff1a8, #ffc23a); color: #3a2400; box-shadow: 0 0 20px rgba(255, 210, 90, 0.45); animation: luckyGlow 1.4s ease-in-out infinite; }
@keyframes luckyGlow { 50% { transform: scale(1.02); } }
@media (prefers-reduced-motion: reduce) { .btn.lucky { animation: none; } }
.btn.ghost { background: transparent; color: var(--paper); border: 1px solid var(--line); font-weight: 400; }

/* intro */
.intro { min-height: calc(100vh - 84px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.intro h1 { font-size: clamp(40px, 10vw, 68px); }
.intro .sub { font-family: var(--display); color: var(--gold); font-size: clamp(20px, 4.5vw, 28px); }
.credit { color: var(--dim); }
.credit b { color: var(--gold); font-weight: 400; font-family: var(--display); font-size: 1.1em; }
.lede { font-size: 17px; max-width: 60ch; }
.disclaimer { color: var(--dim); font-size: 14px; border-left: 2px solid rgba(217,180,91,0.4); padding-left: 12px; margin: 0; max-width: 62ch; }
.seals { display: flex; gap: 8px; flex-wrap: wrap; }
.seal { display: grid; place-items: center; font-family: var(--display); color: #fff3e0; border-radius: 12px; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.22), 0 8px 24px rgba(0,0,0,0.5); flex: none; }
.seals .seal { width: 40px; height: 40px; font-size: 22px; border-radius: 8px; opacity: 0.85; }

/* question */
.progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 22px; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width 0.3s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
.qcard { background: var(--panel); border: 1px solid rgba(217,180,91,0.22); border-radius: 18px; padding: 22px 22px 20px; margin-bottom: 16px; }
.qcard h2 { font-size: clamp(26px, 6vw, 34px); margin: 6px 0 10px; }
.qcard .situation { font-size: 18px; margin: 0 0 8px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { appearance: none; text-align: left; display: flex; gap: 12px; align-items: baseline; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: var(--paper); border-radius: 14px; padding: 14px 16px; font-size: 17px; line-height: 1.6; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.15s; }
.opt b { font-family: var(--display); color: var(--gold); font-weight: 400; font-size: 19px; }
.opt:hover { border-color: rgba(217,180,91,0.6); }
.opt.on { background: rgba(217,180,91,0.16); border-color: var(--gold); }
.opt:active { transform: scale(0.99); }
.qnav { display: flex; justify-content: space-between; margin-top: 16px; }
.linkbtn { appearance: none; background: none; border: 0; color: var(--dim); font-size: 15px; cursor: pointer; padding: 8px 0; }
.fade { animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }

/* result */
.hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 14px 0 6px; }
.hero .seal { width: 120px; height: 120px; font-size: 70px; border-radius: 16px; transform: rotate(-4deg); animation: stamp 0.7s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes stamp { from { transform: rotate(-20deg) scale(1.8); opacity: 0; } }
.hero h1 { font-size: clamp(34px, 8vw, 50px); }
.meta { color: var(--dim); }
.quote { font-family: var(--display); color: var(--gold); font-size: clamp(20px, 4.6vw, 26px); margin: 20px 0 6px; }
section.block { margin-top: 34px; }
section.block > h2 { font-size: 26px; margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
section.block > h2 small { font-family: var(--body); font-size: 13px; color: var(--dim); letter-spacing: 0.05em; }
.story p { font-size: 18px; margin: 0 0 14px; max-width: 64ch; }
.facts { display: grid; gap: 8px; margin-top: 8px; }
.fact { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: baseline; }
.fact span:first-child { color: var(--gold); font-size: 13px; border: 1px solid rgba(217,180,91,0.45); border-radius: 999px; text-align: center; padding: 1px 0; }
.personal p { margin: 0 0 10px; }
.conflict { background: var(--panel); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; border-left: 3px solid var(--gold); }
.conflict h3 { font-size: 20px; margin-bottom: 6px; }
.conflict .ev { color: var(--dim); font-size: 14px; margin-top: 8px; }
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 560px) { .profile { grid-template-columns: 1fr; } }
.radar { width: 100%; max-width: 340px; margin: 0 auto; display: block; }
.bars { display: grid; gap: 10px; }
.bar .top { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar .track { height: 8px; background: var(--line); border-radius: 999px; position: relative; overflow: hidden; }
.bar .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 999px; }
.bar .track em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #b9b0d0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--dim); justify-content: center; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }
details { background: var(--panel); border-radius: 14px; padding: 4px 18px; margin-bottom: 10px; }
summary { cursor: pointer; padding: 12px 0; font-family: var(--display); font-size: 19px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--gold); font-family: var(--body); }
details[open] summary::after { content: "－"; }
details .inner { padding-bottom: 14px; }
details .inner p { margin: 0 0 8px; }
details .inner b { color: var(--gold); font-weight: 400; }
.refs { color: var(--dim); font-size: 13px; }
.evidence h3 { font-size: 19px; margin: 14px 0 6px; }
.evidence ul { margin: 0; padding-left: 20px; }
.evidence li { margin-bottom: 4px; }
.alt { margin-bottom: 14px; }
.alt .top { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.alt .track { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 4px 0; }
.alt .track i { display: block; height: 100%; background: linear-gradient(90deg, #8f86a8, var(--gold)); }
.cotop { background: rgba(217,180,91,0.12); border: 1px solid rgba(217,180,91,0.4); border-radius: 12px; padding: 10px 14px; margin-top: 14px; font-size: 15px; }
.share { background: linear-gradient(140deg, #2b2338, #1b1824); border: 1px solid rgba(217,180,91,0.4); border-radius: 18px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.share .seal { width: 84px; height: 84px; font-size: 48px; margin-bottom: 6px; }
.share h3 { font-size: 30px; }
.actions { display: grid; gap: 10px; margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.history { display: grid; gap: 8px; }
.history h3 { font-size: 20px; }
.hist { appearance: none; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; color: var(--paper); cursor: pointer; font-size: 16px; }
.hist .seal { width: 36px; height: 36px; font-size: 20px; border-radius: 8px; }
.hist small { display: block; color: var(--dim); font-size: 13px; }
/* reveal: the seals spin like a wheel of lives, then one stamps down */
.reveal { min-height: calc(100vh - 84px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
.reveal .wheel { width: 150px; height: 150px; display: grid; place-items: center; position: relative; }
.reveal .wheel .seal { position: absolute; inset: 0; font-size: 84px; border-radius: 18px; }
.reveal .wheel .seal.final { animation: stampBig 0.8s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes stampBig { 0% { transform: scale(2.6) rotate(-25deg); opacity: 0; } 60% { transform: scale(0.92) rotate(-4deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); } }
.reveal .ring { position: absolute; inset: -26px; border-radius: 50%; border: 1px dashed rgba(217,180,91,0.45); animation: spinRing 6s linear infinite; }
@keyframes spinRing { to { transform: rotate(360deg); } }
.reveal .line { font-family: var(--display); color: var(--gold); font-size: clamp(20px, 5vw, 28px); min-height: 1.4em; animation: fade 0.6s ease; }
.reveal .sub { color: var(--dim); font-size: 15px; min-height: 1.3em; }
.reveal .skip { appearance: none; background: none; border: 0; color: var(--dim); font-size: 14px; text-decoration: underline; cursor: pointer; }
/* friendship match */
.match { background: linear-gradient(135deg, rgba(217,180,91,0.16), rgba(143,134,168,0.14)); border: 1px solid rgba(217,180,91,0.5); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.match h2 { margin: 0; }
.match .pair { display: flex; align-items: center; justify-content: center; gap: 14px; }
.match .pair .seal { width: 64px; height: 64px; font-size: 36px; border-radius: 12px; }
.match .pair .who { font-size: 13px; color: var(--dim); text-align: center; }
.match .pair .who b { display: block; color: var(--paper); font-weight: 400; font-family: var(--display); font-size: 16px; }
.match .heart { font-size: 28px; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.25); } }
.match .pct { font-family: var(--display); color: var(--gold); font-size: clamp(40px, 11vw, 60px); text-align: center; line-height: 1; }
.match .kind { text-align: center; font-family: var(--display); font-size: 20px; }
.match p { margin: 0; line-height: 1.7; }
.match .btn { margin-top: 4px; }
/* collection of past lives */
.dex h3 { font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; }
.dex h3 small { color: var(--gold); font-family: var(--body); font-size: 14px; }
.dex .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .dex .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.dex .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); text-align: center; line-height: 1.25; word-break: keep-all; }
.dex .cell .seal { width: 44px; height: 44px; font-size: 24px; border-radius: 9px; }
.dex .cell.locked .seal { background: #2a2636 !important; color: #5d5670; box-shadow: inset 0 0 0 2px #3a3448; }
.dex .cell.new .seal { box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(217,180,91,0.7); }
.dexnote { text-align: center; font-family: var(--display); color: var(--gold); font-size: 18px; }
@media (prefers-reduced-motion: reduce) { .reveal .ring, .match .heart, .reveal .wheel .seal.final { animation: none; } }
.linkbanner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: rgba(217,180,91,0.12); border: 1px solid rgba(217,180,91,0.45); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.linkbanner .btn { width: auto; padding: 10px 16px; font-size: 16px; }
.kakao { background: #fee500; color: #191600; }
.share-text { width: 100%; box-sizing: border-box; font: 14px var(--body); background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: none; }
@media (prefers-reduced-motion: reduce) { .fade, .hero .seal { animation: none; } }
</style>

<script>
const DATA = {"questions":{"version": "1.0", "dimensions": [{"id": "J", "name": "Justice and principle", "desc": "How much you value fairness, rules and responsibility"}, {"id": "C", "name": "Community", "desc": "How you weigh your own interest against the community's"}, {"id": "K", "name": "Inquiry and knowledge", "desc": "How much you put truth-seeking, learning and analysis first"}, {"id": "B", "name": "Courage and action", "desc": "How ready you are to take risks and act"}, {"id": "R", "name": "Care and relationships", "desc": "How much you value family, friends and the vulnerable"}, {"id": "F", "name": "Freedom and independence", "desc": "How much you value questioning authority and judging for yourself"}], "themes": {"distribution": "Justice and distribution", "rules": "Rules and responsibility", "risk": "Risk and sacrifice", "truth": "Truth and knowledge", "power": "Power and resistance", "loyalty": "Bonds and loyalty", "identity": "Death and identity"}, "display_order": ["q01", "q04", "q07", "q10", "q13", "q16", "q19", "q02", "q05", "q08", "q11", "q14", "q17", "q20", "q03", "q06", "q09", "q12", "q15", "q18"], "questions": [{"id": "q01", "theme": "distribution", "title": "The Hungry Winter", "situation": "The village is running out of food. The storehouse cannot feed everyone, and saving some first means the rest go hungry. You hold the key to the storehouse.", "prompt": "Choose the first thing you do.", "debate": "A classic problem of distribution where equal shares for all collide head-on with saving the greatest number. Protecting the weakest first echoes Rawls's argument for putting 'the least advantaged' first.", "options": [{"id": "A", "text": "Share a minimum ration fairly with every villager.", "note": "A choice that values justice, community and principle", "scores": {"J": 2, "C": 1, "K": 0, "B": 0, "R": 1, "F": 0}, "stance": "deont", "tags": ["principle"]}, {"id": "B", "text": "Give first to the group that can save the most lives.", "note": "A choice that values outcomes and survival", "scores": {"J": 0, "C": 2, "K": 1, "B": 1, "R": 0, "F": 0}, "stance": "util", "tags": ["outcome"]}, {"id": "C", "text": "Protect the weakest first: the old, the sick and the children.", "note": "A choice that values care and responsibility to the vulnerable", "scores": {"J": 0, "C": 1, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": []}, {"id": "D", "text": "Put down the key and let the villagers decide together.", "note": "A choice that values autonomy, participation and shared power", "scores": {"J": 1, "C": 1, "K": 0, "B": 0, "R": 0, "F": 2}, "stance": "liberty", "tags": []}]}, {"id": "q02", "theme": "distribution", "title": "Gold After the Battle", "situation": "After the battle the lord sends down a chest of gold. A few soldiers risked their lives on the front line; many more carried food and weapons behind them. Sharing it out is your job.", "prompt": "How do you share the gold?", "debate": "Aristotle saw distributive justice as 'in proportion to each one's merit'. But what counts as merit, and when need or the common good should come before merit, is still argued over today.", "options": [{"id": "A", "text": "Share it according to each one's deeds.", "note": "A choice that values reward in proportion to merit", "scores": {"J": 2, "C": 0, "K": 0, "B": 1, "R": 0, "F": 0}, "stance": "virtue", "tags": ["principle"]}, {"id": "B", "text": "Share it equally. We fought this battle together.", "note": "A choice that values equality and solidarity", "scores": {"J": 1, "C": 2, "K": 0, "B": 0, "R": 0, "F": 0}, "stance": "deont", "tags": []}, {"id": "C", "text": "Send it first to the families of the fallen.", "note": "A choice that values care for those who lost someone", "scores": {"J": 0, "C": 1, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": []}, {"id": "D", "text": "Melt the gold and rebuild the broken bridge.", "note": "A choice that puts the common good before personal reward", "scores": {"J": -1, "C": 2, "K": 1, "B": 0, "R": 0, "F": 0}, "stance": "util", "tags": ["outcome", "community"]}]}, {"id": "q03", "theme": "distribution", "title": "The Well That Never Runs Dry", "situation": "The drought is in its third month. Every well in the village has dried up, except the one in your own yard.", "prompt": "What do you do with the well?", "debate": "Locke held that what you mix your labour with becomes yours, but added that 'enough, and as good' must be left for others. When everyone is thirsty, how far should private property be protected?", "options": [{"id": "A", "text": "Throw the gate open and let anyone draw water.", "note": "A choice that gives up what is yours for the community", "scores": {"J": 0, "C": 2, "K": 0, "B": 0, "R": 1, "F": 0}, "stance": "care", "tags": ["community"]}, {"id": "B", "text": "Set turns and rules: so many buckets a day for each household.", "note": "A choice that sets fair rules", "scores": {"J": 2, "C": 1, "K": 1, "B": 0, "R": 0, "F": 0}, "stance": "deont", "tags": ["principle"]}, {"id": "C", "text": "Give to family and relatives first, then share what is left with the neighbours.", "note": "A choice that protects those closest first", "scores": {"J": 0, "C": -1, "K": 0, "B": 0, "R": 2, "F": 1}, "stance": "care", "tags": ["kin"]}, {"id": "D", "text": "Charge a little for the water and use the money to dig a new well.", "note": "A choice that calculates long-term outcomes", "scores": {"J": -1, "C": 1, "K": 1, "B": 0, "R": 0, "F": 1}, "stance": "util", "tags": ["outcome"]}]}, {"id": "q04", "theme": "rules", "title": "The Secret in the Exam Hall", "situation": "At the civil service exam you see an old friend cheating. Your friend says it is the last chance to restore a ruined family.", "prompt": "What do you do?", "debate": "Kant would ask, 'Could everyone do this?' Care ethics, on the other hand, says to look first at the concrete relationship and the person's circumstances rather than abstract rules.", "options": [{"id": "A", "text": "Tell the proctor the truth.", "note": "A choice that upholds rules and fairness", "scores": {"J": 2, "C": 1, "K": 0, "B": 0, "R": -1, "F": 0}, "stance": "deont", "tags": ["principle", "community"]}, {"id": "B", "text": "Persuade your friend to confess.", "note": "A choice that helps the other person do the right thing", "scores": {"J": 1, "C": 0, "K": 0, "B": 1, "R": 1, "F": 0}, "stance": "virtue", "tags": []}, {"id": "C", "text": "Look away. You know your friend's situation better than anyone.", "note": "A choice that puts the relationship before principle", "scores": {"J": -2, "C": 0, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["kin"]}, {"id": "D", "text": "Expose the flaw in an exam system that makes cheating so easy.", "note": "A choice that criticises the system rather than the person", "scores": {"J": 1, "C": 0, "K": 1, "B": 0, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience"]}]}, {"id": "q05", "theme": "rules", "title": "The Closed Gate", "situation": "The lord has made a new law: once the sun sets, the gate stays shut. You are the gatekeeper, and a refugee family arriving late at night is pounding on the gate. Rumour says bandits are outside.", "prompt": "At the gate, you…", "debate": "The duty to obey the law collides with the duty to save the lives in front of you. When a law's purpose (safety inside the walls) and its letter (no opening at night) part ways, which to follow is an old question of legal philosophy.", "options": [{"id": "A", "text": "Keep the gate shut as the law says. The safety of everyone inside is at stake too.", "note": "A choice that keeps to the rules", "scores": {"J": 2, "C": 1, "K": 0, "B": -1, "R": -1, "F": 0}, "stance": "deont", "tags": ["obey", "principle"]}, {"id": "B", "text": "Open the gate quietly and let them in.", "note": "A choice that puts the person in front of you above the law", "scores": {"J": -1, "C": 0, "K": 0, "B": 1, "R": 2, "F": 1}, "stance": "care", "tags": ["conscience"]}, {"id": "C", "text": "Rush to tell your superior and wait for permission.", "note": "A choice that looks for an answer within procedure", "scores": {"J": 1, "C": 1, "K": 1, "B": 0, "R": 0, "F": -1}, "stance": "deont", "tags": ["obey", "caution"]}, {"id": "D", "text": "Step outside the gate and stay with the family all night.", "note": "A choice that takes on risk to keep both the law and the people", "scores": {"J": 1, "C": 0, "K": 0, "B": 2, "R": 1, "F": 0}, "stance": "virtue", "tags": ["risk"]}]}, {"id": "q06", "theme": "rules", "title": "The Teacher's Error", "situation": "You find a decisive error in the research your teacher has built over a lifetime. Next month your teacher is to receive the nation's highest prize.", "prompt": "What do you do with this?", "debate": "Revealing the truth collides with repaying a debt of gratitude. Once you think about when and how to disclose it, you see that honesty takes many shapes.", "options": [{"id": "A", "text": "Make it public at once. Truth comes first.", "note": "A choice that holds truth as a principle", "scores": {"J": 1, "C": 0, "K": 2, "B": 0, "R": -1, "F": 1}, "stance": "deont", "tags": ["truth", "principle"]}, {"id": "B", "text": "Tell your teacher quietly first.", "note": "A choice that handles the truth within the relationship", "scores": {"J": 0, "C": 0, "K": 1, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": []}, {"id": "C", "text": "Correct it together after the prize is awarded.", "note": "A choice that picks the order that harms everyone least", "scores": {"J": -1, "C": 1, "K": 1, "B": 0, "R": 1, "F": 0}, "stance": "util", "tags": ["outcome", "comfort"]}, {"id": "D", "text": "Go your own way and publish research that refutes it.", "note": "A choice that breaks free of authority", "scores": {"J": 0, "C": 0, "K": 1, "B": 1, "R": -1, "F": 2}, "stance": "liberty", "tags": ["conscience"]}]}, {"id": "q07", "theme": "risk", "title": "The Child in the River", "situation": "A stranger's child is swept away by the swollen river. You are not a strong swimmer.", "prompt": "In that moment, you…", "debate": "Aristotle saw courage as the mean between recklessness and cowardice. The same rescue can be courage or recklessness depending on whether practical wisdom reads the situation.", "options": [{"id": "A", "text": "Jump in without a second thought.", "note": "A choice that acts despite the danger", "scores": {"J": 0, "C": 0, "K": -1, "B": 2, "R": 2, "F": 0}, "stance": "virtue", "tags": ["risk"]}, {"id": "B", "text": "Shout for people and look for a rope.", "note": "A choice that solves it together", "scores": {"J": 0, "C": 2, "K": 1, "B": 0, "R": 1, "F": 0}, "stance": "util", "tags": ["caution"]}, {"id": "C", "text": "Read the current, run downstream and hold out a long pole.", "note": "A choice that uses judgement and action together", "scores": {"J": 0, "C": 0, "K": 2, "B": 1, "R": 1, "F": 0}, "stance": "virtue", "tags": []}, {"id": "D", "text": "If I get hurt my family falls apart. Run to the village for help.", "note": "A choice that weighs your own and your family's safety first", "scores": {"J": 0, "C": 0, "K": 0, "B": -2, "R": 1, "F": 1}, "stance": "self", "tags": ["kin", "caution"]}]}, {"id": "q08", "theme": "risk", "title": "To the Plague Town", "situation": "Plague has broken out in the next town and someone must carry medicine there. Whoever goes may never come back.", "prompt": "Who should go?", "debate": "Philosophy calls sacrifice beyond duty 'supererogation'. It deserves praise, but it cannot be demanded of everyone.", "options": [{"id": "A", "text": "Volunteer to go yourself.", "note": "A choice that takes on risk for the community", "scores": {"J": 0, "C": 1, "K": 0, "B": 2, "R": 1, "F": 0}, "stance": "virtue", "tags": ["risk", "community"]}, {"id": "B", "text": "Stay with your family, but pay for all the medicine and supplies.", "note": "A choice that protects family while helping another way", "scores": {"J": 0, "C": 1, "K": 0, "B": -1, "R": 2, "F": 0}, "stance": "care", "tags": ["kin", "caution"]}, {"id": "C", "text": "Propose drawing lots fairly.", "note": "A choice that shares the risk fairly", "scores": {"J": 2, "C": 1, "K": 0, "B": 0, "R": 0, "F": 0}, "stance": "deont", "tags": ["principle"]}, {"id": "D", "text": "Find someone who has survived the plague and send them.", "note": "A choice that weighs the odds of success", "scores": {"J": 0, "C": 1, "K": 2, "B": 0, "R": 0, "F": 0}, "stance": "util", "tags": ["outcome"]}]}, {"id": "q09", "theme": "risk", "title": "Colleagues Punished in Your Place", "situation": "Your mistake set the granary on fire. When the culprit could not be found, your co-workers were sentenced to a flogging instead.", "prompt": "What do you do?", "debate": "What does it mean to take responsibility? The courage to own a mistake, the solidarity to solve it together and the criticism that asks whether the punishment is just can all be called 'responsibility'.", "options": [{"id": "A", "text": "Step forward and say it was your fault.", "note": "A choice that takes responsibility by principle", "scores": {"J": 2, "C": 0, "K": 0, "B": 2, "R": 1, "F": 0}, "stance": "deont", "tags": ["principle", "risk"]}, {"id": "B", "text": "Talk it over with your co-workers first and find a way together.", "note": "A choice that looks for a shared solution", "scores": {"J": 0, "C": 2, "K": 0, "B": 0, "R": 1, "F": 0}, "stance": "care", "tags": []}, {"id": "C", "text": "Protest that a law flogging people for one mistake is wrong.", "note": "A choice that questions whether the punishment is just", "scores": {"J": 1, "C": 0, "K": 0, "B": 1, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience"]}, {"id": "D", "text": "Quietly look after your co-workers' families to repay the debt.", "note": "A choice that makes amends out of sight", "scores": {"J": -1, "C": 0, "K": 0, "B": -1, "R": 2, "F": 0}, "stance": "care", "tags": ["caution"]}]}, {"id": "q10", "theme": "truth", "title": "The Record of Victory", "situation": "The king orders the last war recorded as a 'great victory'. As the official chronicler, you know it was a crushing defeat in which countless people died.", "prompt": "Brush in hand, you…", "debate": "In the Republic, Plato speaks of a 'noble lie' for the stability of the community. Kant, by contrast, held that lying treats others merely as a means. Which comes first, the truth of the record or the stability of the community?", "options": [{"id": "A", "text": "Record it exactly as you saw it.", "note": "A choice that guards the truth", "scores": {"J": 2, "C": 0, "K": 2, "B": 1, "R": -1, "F": 0}, "stance": "deont", "tags": ["truth", "conscience"]}, {"id": "B", "text": "Write as ordered, but hide the true record elsewhere.", "note": "A choice that endures now and waits for a later day", "scores": {"J": -1, "C": 0, "K": 2, "B": 0, "R": 0, "F": 1}, "stance": "util", "tags": ["outcome", "caution"]}, {"id": "C", "text": "Obey the king. The people's morale matters too.", "note": "A choice that puts the community's stability first", "scores": {"J": -1, "C": 2, "K": -1, "B": 0, "R": 1, "F": 0}, "stance": "util", "tags": ["obey", "comfort"]}, {"id": "D", "text": "Break your brush and leave office.", "note": "A choice that steps away rather than join the lie", "scores": {"J": 1, "C": 0, "K": 0, "B": 0, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience"]}]}, {"id": "q11", "theme": "truth", "title": "The Forbidden Medical Book", "situation": "There is a book that tells how to cure the disease. But it is banned, and anyone caught reading it is branded a heretic.", "prompt": "What do you do with the book?", "debate": "In On Liberty, Mill argued that freedom of thought and discussion is essential for finding the truth. But using untested knowledge right away puts other people's lives at stake.", "options": [{"id": "A", "text": "Read it in secret and heal the sick.", "note": "A choice that puts outcomes above rules", "scores": {"J": -1, "C": 0, "K": 2, "B": 1, "R": 1, "F": 0}, "stance": "util", "tags": ["outcome", "risk"]}, {"id": "B", "text": "Publicly ask for the ban to be lifted.", "note": "A choice that demands freedom of knowledge", "scores": {"J": 0, "C": 0, "K": 1, "B": 1, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience"]}, {"id": "C", "text": "A ban is a ban. Don't read it.", "note": "A choice that follows the established order", "scores": {"J": 2, "C": 1, "K": -1, "B": -1, "R": 0, "F": 0}, "stance": "deont", "tags": ["obey", "caution"]}, {"id": "D", "text": "Test it with a few people you trust, then use it little by little.", "note": "A choice that handles knowledge with care", "scores": {"J": 0, "C": 1, "K": 1, "B": 0, "R": 1, "F": 0}, "stance": "virtue", "tags": ["caution"]}]}, {"id": "q12", "theme": "truth", "title": "The Last Question", "situation": "An old man on the brink of death asks: \"Is my son coming home alive from the war?\" You know his son was killed in battle.", "prompt": "What do you tell him?", "debate": "Kant said you must not lie even to a murderer at the door, and drew many objections. Utilitarianism holds a lie may be allowed if it reduces suffering. It is the classic scene where truth and comfort collide.", "options": [{"id": "A", "text": "Tell him the truth.", "note": "A choice that holds to truth as a principle", "scores": {"J": 2, "C": 0, "K": 1, "B": 0, "R": -1, "F": 0}, "stance": "deont", "tags": ["truth", "principle"]}, {"id": "B", "text": "Take his hand and say, \"He'll be home soon.\"", "note": "A choice that gives peace in the final moment", "scores": {"J": -1, "C": 0, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["comfort", "outcome"]}, {"id": "C", "text": "Say \"I'm not sure,\" and stay by his side to the end.", "note": "A choice that avoids both the lie and the wound", "scores": {"J": 1, "C": 0, "K": 0, "B": 0, "R": 1, "F": 0}, "stance": "virtue", "tags": ["caution"]}, {"id": "D", "text": "Tell him how bravely his son fought to the end.", "note": "A choice that delivers the truth in a comforting way", "scores": {"J": 0, "C": 0, "K": 1, "B": 1, "R": 1, "F": 0}, "stance": "virtue", "tags": ["truth"]}]}, {"id": "q13", "theme": "power", "title": "An Invitation to a Secret Meeting", "situation": "A secret circle plotting to overthrow a ruler who tramples the people asks you to join. If it fails, your whole family will be in danger.", "prompt": "Your answer?", "debate": "Hobbes thought a strong sovereign better than chaos; in the Second Treatise, Locke argued that when a government betrays its trust the people have a right to resist.", "options": [{"id": "A", "text": "Join them.", "note": "A choice that stands against unjust power", "scores": {"J": 1, "C": 0, "K": 0, "B": 2, "R": -1, "F": 2}, "stance": "liberty", "tags": ["risk", "conscience"]}, {"id": "B", "text": "Refuse, and submit a lawful petition instead.", "note": "A choice that seeks change within the order", "scores": {"J": 2, "C": 1, "K": 0, "B": -1, "R": 0, "F": 0}, "stance": "deont", "tags": ["obey", "caution"]}, {"id": "C", "text": "Keep your distance for your family's sake.", "note": "A choice that protects your family's safety first", "scores": {"J": 0, "C": 0, "K": 0, "B": -1, "R": 2, "F": -1}, "stance": "self", "tags": ["kin", "caution"]}, {"id": "D", "text": "Don't join, but keep a record of everything.", "note": "A choice to remain a witness", "scores": {"J": 0, "C": 0, "K": 2, "B": 0, "R": 0, "F": 1}, "stance": "virtue", "tags": ["truth"]}]}, {"id": "q14", "theme": "power", "title": "The Price of High Office", "situation": "The new ruler offers you a high post — if you hand over your old comrades' secrets.", "prompt": "Your choice?", "debate": "The thought 'I'll change things from the inside' raises the question of whether the end can justify the means. Philosophers sometimes call this the problem of 'dirty hands'.", "options": [{"id": "A", "text": "Refuse flatly.", "note": "A choice that keeps principle and faith", "scores": {"J": 2, "C": 0, "K": 0, "B": 1, "R": 1, "F": 0}, "stance": "deont", "tags": ["principle"]}, {"id": "B", "text": "Accept, and change the world from within.", "note": "A choice that compromises for a greater result", "scores": {"J": -1, "C": 1, "K": 1, "B": 1, "R": -1, "F": -1}, "stance": "util", "tags": ["outcome", "obey"]}, {"id": "C", "text": "Warn your comrades and flee together.", "note": "A choice that protects your comrades", "scores": {"J": 0, "C": 0, "K": 0, "B": 1, "R": 2, "F": 1}, "stance": "care", "tags": ["kin"]}, {"id": "D", "text": "Expose the offer to the world.", "note": "A choice that openly defies power", "scores": {"J": 1, "C": 0, "K": 0, "B": 2, "R": -1, "F": 2}, "stance": "liberty", "tags": ["conscience", "risk"]}]}, {"id": "q15", "theme": "power", "title": "Taxes in a Year of Famine", "situation": "Even in a famine year, the king has doubled taxes. You are the official who collects them.", "prompt": "What do you do?", "debate": "In Civil Disobedience, Thoreau wrote that there is a duty not to obey unjust laws. Others object that breaking the law can collapse order and hurt the weakest most.", "options": [{"id": "A", "text": "Refuse to collect.", "note": "A choice that refuses an unjust order", "scores": {"J": 1, "C": 0, "K": 0, "B": 1, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience", "risk"]}, {"id": "B", "text": "Collect, but secretly leave out the poorest households.", "note": "A choice that quietly protects the vulnerable", "scores": {"J": -1, "C": 1, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["outcome"]}, {"id": "C", "text": "Collect by the law, but petition for lower taxes.", "note": "A choice that keeps order while seeking to correct it", "scores": {"J": 2, "C": 1, "K": 0, "B": 0, "R": 0, "F": -1}, "stance": "deont", "tags": ["obey", "principle"]}, {"id": "D", "text": "Publish the ledgers to show where the taxes go.", "note": "A choice that uses transparency as a weapon", "scores": {"J": 1, "C": 0, "K": 2, "B": 0, "R": 0, "F": 1}, "stance": "liberty", "tags": ["truth"]}]}, {"id": "q16", "theme": "loyalty", "title": "Your Brother's Trial", "situation": "You are the district judge. Today the accused standing before you is your own younger brother.", "prompt": "With the verdict ahead, you…", "debate": "In the Analects, Confucius says it is upright for father and son to cover for each other's wrongs. It is where equality before the law collides head-on with loyalty to family.", "options": [{"id": "A", "text": "Judge strictly by the law.", "note": "A choice that puts the law before family", "scores": {"J": 2, "C": 1, "K": 0, "B": 0, "R": -2, "F": 0}, "stance": "deont", "tags": ["principle", "community"]}, {"id": "B", "text": "Step down from this trial.", "note": "A choice that sets judgement aside to keep things fair", "scores": {"J": 1, "C": 0, "K": 1, "B": 0, "R": 0, "F": 0}, "stance": "virtue", "tags": ["caution"]}, {"id": "C", "text": "Weigh his circumstances and reduce the sentence.", "note": "A choice that protects family", "scores": {"J": -1, "C": 0, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["kin"]}, {"id": "D", "text": "Go with your brother to the victim, ask forgiveness and make amends.", "note": "A choice that puts restoration before punishment", "scores": {"J": 1, "C": 1, "K": 0, "B": 1, "R": 1, "F": 0}, "stance": "virtue", "tags": []}]}, {"id": "q17", "theme": "loyalty", "title": "War and an Ailing Parent", "situation": "War has broken out and every able man in the village is leaving. If you go too, your sick parents will be left alone.", "prompt": "What do you do?", "debate": "In Existentialism Is a Humanism, Sartre tells of a student who brought him this very dilemma. His answer: 'No ethical theory will choose for you. You choose, and the choice makes you.'", "options": [{"id": "A", "text": "March off. Without the community there is no family.", "note": "A choice that puts responsibility to the community first", "scores": {"J": 0, "C": 2, "K": 0, "B": 1, "R": -1, "F": 0}, "stance": "util", "tags": ["community", "risk"]}, {"id": "B", "text": "Stay with your parents.", "note": "A choice that puts responsibility to family first", "scores": {"J": 0, "C": -1, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["kin"]}, {"id": "C", "text": "Stay and take charge of the village's food and wounded.", "note": "A choice that looks for a way to keep both", "scores": {"J": 0, "C": 1, "K": 1, "B": 0, "R": 1, "F": 0}, "stance": "virtue", "tags": []}, {"id": "D", "text": "First ask whether this war is just, and oppose it.", "note": "A choice that questions the war's legitimacy", "scores": {"J": 1, "C": 0, "K": 0, "B": 1, "R": 0, "F": 2}, "stance": "liberty", "tags": ["conscience"]}]}, {"id": "q18", "theme": "loyalty", "title": "Your Friend Is Wrong", "situation": "At the village meeting an old friend makes a mistaken argument. Your friend's standing is on the line.", "prompt": "What do you do?", "debate": "In the Nicomachean Ethics, Aristotle said friends and truth are both dear, but it is right to honour truth more. It later became the saying 'Plato is my friend, but truth is a better friend.'", "options": [{"id": "A", "text": "Give the counter-evidence right there.", "note": "A choice that puts truth before the relationship", "scores": {"J": 1, "C": 0, "K": 1, "B": 1, "R": -1, "F": 1}, "stance": "deont", "tags": ["truth"]}, {"id": "B", "text": "Talk to your friend privately after the meeting.", "note": "A choice that tells the truth while keeping the relationship", "scores": {"J": 0, "C": 0, "K": 1, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["comfort"]}, {"id": "C", "text": "Quietly pass the evidence to someone else to raise.", "note": "A choice that avoids conflict but secures the result", "scores": {"J": 0, "C": 1, "K": 1, "B": -1, "R": 0, "F": 0}, "stance": "util", "tags": ["caution"]}, {"id": "D", "text": "Take your friend's side. Friendship comes first.", "note": "A choice that puts loyalty first", "scores": {"J": -1, "C": -1, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": "care", "tags": ["kin"]}]}, {"id": "q19", "theme": "identity", "title": "The Potion of Forgetting", "situation": "There is a mysterious potion. Drink it and you lose every memory you have, and begin a new life without pain.", "prompt": "What do you do with the potion?", "debate": "Locke held that continuous memory makes the same person. Hume suspected the 'self' is only a bundle of perceptions, and Buddhism says the stream of action continues without a fixed self. Would you still be you without your memories?", "options": [{"id": "A", "text": "Don't drink it. My memories are me.", "note": "A choice that sees identity as continuous memory", "scores": {"J": 1, "C": 0, "K": 2, "B": 0, "R": 0, "F": 0}, "stance": null, "lens": "locke", "tags": []}, {"id": "B", "text": "Drink it. I am who I am now, not my memories.", "note": "A choice that lets go of a fixed self", "scores": {"J": 0, "C": 0, "K": 0, "B": 1, "R": 0, "F": 2}, "stance": null, "lens": "buddhism", "tags": ["risk"]}, {"id": "C", "text": "Ask to keep just your memories of the people you love.", "note": "A choice that keeps the self found in relationships", "scores": {"J": 0, "C": 0, "K": 0, "B": 0, "R": 2, "F": 0}, "stance": null, "lens": "relation", "tags": []}, {"id": "D", "text": "Write your memories down first, then drink.", "note": "A choice that carries the self on through a record", "scores": {"J": 0, "C": 1, "K": 1, "B": 0, "R": 0, "F": 1}, "stance": null, "lens": "hume", "tags": []}]}, {"id": "q20", "theme": "identity", "title": "The One Thing You Leave", "situation": "It is the last day of your life. You can leave just one thing to the world.", "prompt": "What do you leave?", "debate": "In Plato's Phaedo, Socrates speaks of the philosophical life even as he faces death. What we leave behind may be a principle, a relationship, knowledge, or the fact that we lived our one life as our own.", "options": [{"id": "A", "text": "The promises and principles you kept to the end.", "note": "A choice that sees principle as a life's legacy", "scores": {"J": 2, "C": 0, "K": 0, "B": 1, "R": 0, "F": 0}, "stance": null, "lens": "principle", "tags": []}, {"id": "B", "text": "The village you built together and its people.", "note": "A choice that sees community as the legacy", "scores": {"J": 0, "C": 2, "K": 0, "B": 0, "R": 1, "F": 0}, "stance": null, "lens": "relation", "tags": []}, {"id": "C", "text": "One truth discovered over a lifetime.", "note": "A choice that sees knowledge as the legacy", "scores": {"J": 0, "C": 0, "K": 2, "B": 0, "R": 0, "F": 1}, "stance": null, "lens": "locke", "tags": []}, {"id": "D", "text": "The fact that you lived bound to no one.", "note": "A choice that sees freedom as the legacy", "scores": {"J": 0, "C": 0, "K": 0, "B": 1, "R": 0, "F": 2}, "stance": null, "lens": "buddhism", "tags": []}]}]},"characters":{"version": "1.0", "alpha": {"J": 1, "C": 1, "K": 1, "B": 1, "R": 1, "F": 1}, "tie_margin": 3, "shrink": 0.3, "note": "target is computed by tools/calibrate.py by simulating answers with each character's weights. All character stories are fiction; none are real people.", "dimension_lines": {"top": {"J": "In your answers, a refusal to bend your principles showed most strongly. For {name} in the story, it was the reference point to return to whenever things wavered.", "C": "In your answers, thinking first of how people live together showed most strongly. For {name} in the story, it was the habit of counting 'us' before 'me'.", "K": "In your answers, a need to keep asking and questioning showed most strongly. For {name} in the story, it was the habit of stopping long before what others walked past.", "B": "In your answers, action that comes before fear showed most strongly. For {name} in the story, it was a body that moved first whenever crisis came.", "R": "In your answers, looking after those close to you and the vulnerable first showed most strongly. For {name} in the story, it was a heart that never forgot a single face.", "F": "In your answers, refusing to take anyone's word at face value showed most strongly. For {name} in the story, it was the stubbornness to make a path instead of following one."}, "low": "By contrast, your '{dim}' answers were the quietest. That isn't a lack — it means that in this story, that place was given over to other values."}, "characters": [{"id": "scholar", "name": "The Chronicling Historian", "seal": "史", "emoji": "📜", "color": "#7a5c2e", "era": "14th century · late Goryeo", "region": "Gaegyeong", "occupation": "Royal chronicler (sagwan)", "life": "A life of writing down everything seen and heard at the king's side", "summary": "The one who wrote the truth down", "story": ["As Goryeo was fading, a young chronicler in the palace at Gaegyeong recorded the king's words and deeds every day. He believed that with a single brush he guarded something that would outlast the powerful. On the day the king trampled farmers' fields on a hunt, on the days ministers slandered one another, his record left nothing out.", "One year the king ordered him to rewrite a defeat in the northern campaign as a victory. He submitted the draft as ordered, and each night copied the true record and hid it deep in a mountain temple. When it came to light decades later, the names of forgotten soldiers finally found their place."], "key_event": "The night he received the royal order to rewrite, and decided to keep two records", "conflict": "He believed guarding the truth was always right, yet the thought that the hidden record could endanger his family and students tormented him for years.", "quote": "If we don't write it down today, tomorrow no one will remember.", "plato_echo": "If old documents or handwriting draw you in for no reason", "karma": "Seeing, writing, leaving behind", "weights": {"K": 1.0, "J": 0.8, "F": 0.5, "R": -0.2, "C": 0.1}, "target": {"J": 55, "C": 34, "K": 50, "B": 43, "R": 33, "F": 46}}, {"id": "healer", "name": "The Healer in the Plague", "seal": "醫", "emoji": "🌿", "color": "#4f7a4a", "era": "1348 · the Black Death", "region": "A mountain village in Tuscany", "occupation": "Herbal healer", "life": "A life of gathering herbs and staying beside sick neighbours", "summary": "The one who stayed to the end", "story": ["In the year the Black Death swept through Italy, a woman who worked with herbs lived in a Tuscan mountain village. When the doctors fled the cities, she cooled the burning foreheads of her neighbours in smoke of mugwort and rosemary.", "Even before diseases she could not cure, she made it her work never to let anyone die alone. When the villagers wanted to send the sick outside the village, she turned a barn at the edge of town into an infirmary and spent the winter there."], "key_event": "Standing alone against the village council that wanted the sick driven out, and turning a barn into an infirmary", "conflict": "Her wish to care for one more person collided every day with her duty to protect the whole village from the disease. Even protecting her own safety felt like selfishness to her.", "quote": "Even when you can't heal, you can stay beside them.", "plato_echo": "If the scent of herbs or holding a sick person's hand feels strangely familiar", "karma": "Staying beside", "weights": {"R": 1.0, "C": 0.7, "B": 0.4, "K": 0.3}, "target": {"J": 38, "C": 46, "K": 34, "B": 40, "R": 57, "F": 31}}, {"id": "merchant", "name": "The Merchant of the Road", "seal": "商", "emoji": "🐫", "color": "#a8642a", "era": "8th century · Tang dynasty", "region": "The Silk Road, from Samarkand to Chang'an", "occupation": "Leader of a Sogdian caravan", "life": "A life leading camel trains across borders and languages", "summary": "The one who joined roads and trust", "story": ["Born in Samarkand, he first crossed the desert with a camel train at fourteen. Carrying silk and silver, spices and paper, he learned to bargain in five languages and to tell at a glance whether a stranger could be trusted.", "His caravan dug wells and built rest houses in every oasis town. Making a profit was the trade, but if the road collapsed there would be no trade — that was his reckoning. Even after settling in Chang'an he kept the common fund for merchants from home to the end."], "key_event": "Lending his camels to a foreign caravan robbed by bandits. That trust saved his life years later.", "conflict": "He loved the freedom of being tied to nowhere, yet the roads and people he built up bound him ever more to one place. The tug of war between freedom and responsibility lasted all his life.", "quote": "A good deal brings both people back again.", "plato_echo": "If maps or unfamiliar market alleys draw you in for no reason", "karma": "Giving and receiving trust", "weights": {"F": 0.6, "C": 0.7, "K": 0.5, "B": -0.3, "J": -0.2}, "target": {"J": 43, "C": 44, "K": 51, "B": 36, "R": 39, "F": 41}}, {"id": "guardian", "name": "The Frontier Guardian", "seal": "守", "emoji": "🛡️", "color": "#5b6b7a", "era": "5th century · Goguryeo", "region": "A border fortress in Liaodong", "occupation": "Deputy commander of a fortress", "life": "A life of standing first before danger and resting last", "summary": "The one who stood at the front", "story": ["At Goguryeo's western edge, in a small fortress overlooking the Liaodong plain, there was a deputy commander. Whenever the enemy came he stood at the very front of the gate, and he knew by heart the name of everyone in the village below.", "One winter the lord of the fortress ordered the village abandoned and the gate barred. Looking for a way to protect the village without disobeying, he split his troops and spent the night moving the refugees to a valley behind the fortress. When the enemy arrived the next morning, the village was empty."], "key_event": "The winter night the order to bar the gate came, when he moved the refugees to the valley", "conflict": "He always walked a tightrope between obeying orders and his conscience telling him to protect the people before him. His duty as a soldier and his feelings as a man weighed down the tip of his sword.", "quote": "Walls are built of stone, but what they guard is people.", "plato_echo": "If your heart races looking down over wide fields from a height", "karma": "Standing in front", "weights": {"B": 1.0, "R": 0.6, "J": 0.5, "C": 0.4, "F": -0.3}, "target": {"J": 52, "C": 37, "K": 35, "B": 53, "R": 47, "F": 31}}, {"id": "judge", "name": "The Judge with the Scales", "seal": "判", "emoji": "⚖️", "color": "#3d4f7a", "era": "11th century · Northern Song", "region": "A small county south of the Yangtze", "occupation": "County magistrate, governor and judge in one", "life": "A life of keeping the county in order with law and ledgers", "summary": "The one whose scales never tipped", "story": ["In the Northern Song, a new magistrate arrived in a county south of the Yangtze. On his first day he brought out every ledger in the office and checked them through the night, finding where the missing grain had gone: into the storehouses of the local gentry.", "He judged high and low by the same law. To anyone who brought a bribe, he wrote the exact amount into the verdict. Long after he left, people still spoke of 'the scales of those days'."], "key_event": "A verdict that punished the county's most powerful family by the law", "conflict": "He tried to apply the same law to everyone, but there were moments when the law could not save a person. With every verdict he wrestled between keeping principle and weighing the circumstances in front of him.", "quote": "When the scales tip, the weakest fall first.", "plato_echo": "If you feel an odd calm setting rules or putting ledgers in order", "karma": "Dividing fairly", "weights": {"J": 1.0, "C": 0.6, "K": 0.4, "R": -0.3, "F": -0.2}, "target": {"J": 62, "C": 45, "K": 38, "B": 39, "R": 34, "F": 31}}, {"id": "rebel", "name": "The Blacksmith with the Banner", "seal": "旗", "emoji": "🚩", "color": "#a83232", "era": "1381 · the English Peasants' Revolt", "region": "The villages of Kent", "occupation": "Blacksmith and speaker of the revolt", "life": "A life of crying out in the square and gathering people on the road", "summary": "The one who raised a banner against injustice", "story": ["In the summer of 1381, when a third poll tax was laid on England, the peasants of Kent rose up. Among them was a young blacksmith who went about reciting the words of the wandering preacher John Ball. In every village square he cried the question again: \"When Adam delved and Eve span, who was then the gentleman?\"", "At his call his neighbours took up hammers and sickles and marched to London. The king promised to meet their demands, but the promise was broken and the revolt ended in blood. Yet the question he left in the squares never faded."], "key_event": "The day he gave the first speech against the poll tax and the villagers raised banners behind him", "conflict": "Standing against unjust power was right, but the price paid by those who followed him was too high. He could never let go of the fact that a voice crying for freedom puts other people's lives at stake.", "quote": "Who was the master from the beginning?", "plato_echo": "If your body burns first in the face of injustice", "karma": "Raising your voice against injustice", "weights": {"F": 1.0, "B": 0.7, "J": 0.5, "C": 0.4}, "target": {"J": 52, "C": 33, "K": 34, "B": 54, "R": 37, "F": 53}}, {"id": "monk", "name": "The Mountain Monk", "seal": "禪", "emoji": "🪷", "color": "#6a5a8c", "era": "8th century · Unified Silla", "region": "A small hermitage on Namsan, Gyeongju", "occupation": "A monk who copied scriptures and listened to people's troubles", "life": "A life a little apart from the world, asking, listening and thinking", "summary": "The one who asked and listened", "story": ["When Unified Silla was at its height, a monk lived in a small hermitage among the rocks of Namsan in Gyeongju. By day he copied scriptures, and in the evening he listened to the troubles of people who climbed the mountain. Royalty and slaves sat in the same place before him.", "All his life he asked whether there truly is such a thing as 'I'. He never said he had found the answer, but those who visited him went down the mountain with lighter faces. What he left was not a book but a small Buddha carved into a rock."], "key_event": "Declining to head a great temple in the capital and choosing to stay at the hermitage", "conflict": "He wanted to ease the world's suffering, but never became sure whether the way was to go into its midst or to stand apart. Keeping his stillness sometimes felt like turning away.", "quote": "As long as someone is asking, the answer need not hurry.", "plato_echo": "If time seems to stop at a quiet mountain temple or before an old stone Buddha", "karma": "Asking and listening", "weights": {"K": 0.8, "R": 0.5, "F": 0.5, "B": -0.6, "C": -0.2}, "target": {"J": 40, "C": 30, "K": 46, "B": 36, "R": 53, "F": 39}}, {"id": "navigator", "name": "The Star-Reading Navigator", "seal": "星", "emoji": "🧭", "color": "#2e5f7a", "era": "15th century · the Indian Ocean trade", "region": "From the Arabian Sea to the East African coast", "occupation": "Navigator of a dhow", "life": "A life of calculating stars and winds to cross seas no one had sailed", "summary": "The one who found the way by the stars", "story": ["In the 15th-century Indian Ocean, dhows came and went on the monsoon winds. On one of them was a navigator who measured the height of the stars in finger-widths. On every crossing he noted the stars and currents in his notebook, and drew sea routes more accurate than anyone's.", "Ship owners called him 'the scholar of the sea'. When storms came he lowered the sails before anyone, and though he knew a dangerous route was faster, he would not stake his sailors' lives on it. Instead he chose to cross the danger alone first."], "key_event": "The voyage when he left his crew in port and tested a new route first in a small boat", "conflict": "His longing to know the unknown always collided with the weight of responsibility for the lives aboard. He hoped his curiosity would never cost anyone else.", "quote": "The sea can be calculated — but humbly.", "plato_echo": "If the constellations or the horizon fill you with a longing you can't explain", "karma": "Measuring and recording the unknown", "weights": {"K": 1.0, "B": 0.7, "F": 0.3, "J": -0.4, "R": -0.2}, "target": {"J": 42, "C": 38, "K": 54, "B": 45, "R": 38, "F": 41}}, {"id": "matriarch", "name": "The Matriarch of the Clan", "seal": "家", "emoji": "🏮", "color": "#8c4a3a", "era": "18th century · late Joseon", "region": "A head family's house in Andong", "occupation": "Head wife running the great household and the clan's affairs", "life": "A life of single-handedly running dozens of family members and guests, rites and famine years", "summary": "The one who fed everyone", "story": ["In late Joseon, a woman married at eighteen into the head family of a clan in Andong. Running a household of over a hundred, endless guests and ancestral rites all year round, she never took the bundle of storehouse keys from her waist.", "In a year of great famine the clan elders wanted the storehouse kept shut. She opened the ledgers, calculated what the clan needed to get by, and cooked the rest into porridge for the villagers. That winter, no one in the village starved."], "key_event": "The famine winter she opened the storehouse and shared porridge with the village", "conflict": "She was always weighing the duty to protect the household against caring for people outside it. Being called strict with family and generous to strangers stayed with her as both praise and wound.", "quote": "A storehouse isn't there to be locked — it's there so you know when to open it.", "plato_echo": "If an old hanok house or a crowded holiday kitchen strangely puts you at ease", "karma": "Embracing and feeding", "weights": {"R": 1.0, "C": 0.8, "J": 0.4, "F": -0.5, "B": -0.2}, "target": {"J": 44, "C": 48, "K": 32, "B": 36, "R": 55, "F": 28}}, {"id": "performer", "name": "The Troupe Leader", "seal": "樂", "emoji": "🎭", "color": "#b0457a", "era": "19th century · late Joseon", "region": "Market towns and mountain passes of Gyeonggi and Chungcheong", "occupation": "Head (kkokdusoe) of a travelling performance troupe", "life": "A life wandering from market to market sharing laughter and satire", "summary": "The one who held people with laughter", "story": ["In late Joseon, on market days a namsadang troupe would come over the mountain pass. Its leader made people laugh with tightrope walking and mask plays, and turned the market upside down mimicking the nobles and corrupt officials.", "He took in the children who joined the troupe as his own. Children with nowhere to go, children thrown out of home, children without even a name were all one family in his troupe. When the magistrate banned the shows, he simply moved on to the next market and never stopped the play."], "key_event": "Crossing the pass all night to dodge the magistrate's ban and putting on the show at the next market", "conflict": "Freedom tied to nowhere kept him alive, but the children he took in needed a place to stay. Between a wandering life and a family to protect, he was always on the road.", "quote": "While we laugh, there are no nobles and no commoners.", "plato_echo": "If your body moves first to drumbeats or the rhythm of a mask dance", "karma": "Holding people with laughter", "weights": {"F": 0.9, "R": 0.8, "J": -0.7, "B": 0.3, "C": -0.2}, "target": {"J": 37, "C": 30, "K": 32, "B": 45, "R": 55, "F": 41}}, {"id": "artisan", "name": "The Bridge Builder", "seal": "匠", "emoji": "🌉", "color": "#6b6b5a", "era": "2nd century · Roman Empire", "region": "Province of Gaul (today's southern France)", "occupation": "Master builder leading the stonemasons", "life": "A life of shaping stone into roads and waterways for people", "summary": "The one who built a bridge for all to cross", "story": ["When the Roman Empire was at its widest, stonemasons were raising an aqueduct by a river in Gaul. The master who led them measured even the tilt of each stone himself, and knew every worker's name and home town.", "He did not carve his own name into the bridge. Instead, on the day it was finished, he watched for a long time as villagers and workers crossed the river together. The waterway he built supplied the city for hundreds of years."], "key_event": "When the governor told him to hurry, he delayed the work three months to lay the foundations again", "conflict": "He worked believing he did it for everyone, but some days he had to ignore each worker's exhaustion for the sake of that 'everyone'. The reckoning between the common good and each person's share never let him go.", "quote": "A good bridge outlives the one who built it.", "plato_echo": "If your fingertips itch before an old stone bridge or a finely made building", "karma": "Building what all will share", "weights": {"C": 1.0, "K": 0.6, "J": 0.3, "F": -0.2}, "target": {"J": 51, "C": 53, "K": 44, "B": 37, "R": 36, "F": 27}}, {"id": "mediator", "name": "The Interpreter of Two Tongues", "seal": "和", "emoji": "🤝", "color": "#4a7a6e", "era": "17th century · between Joseon and Japan", "region": "The Japan House (Waegwan) at Dongnae, Busan", "occupation": "Interpreter between Joseon and Japan", "life": "A life of joining the words of two worlds without taking either side", "summary": "The one who joined two worlds", "story": ["Some decades after the Imjin War, an interpreter at the Japan House in Dongnae, Busan, spoke both Korean and Japanese. The wounds of war had not yet healed, but he chose and re-chose every word so the two peoples could sit face to face again.", "He knew no negotiation ends on justice alone, on profit alone or on goodwill alone. So he leaned on no single value and weighed the scales afresh each time. People called him spineless — and also the most trustworthy man they knew."], "key_event": "Mediating all night between an envoy and a Tsushima official to keep the negotiation alive", "conflict": "Taking no one's side also meant being fully accepted by no one. Keeping the balance was his greatest talent and his deepest loneliness.", "quote": "Carrying words across is carrying hearts across.", "plato_echo": "If you naturally end up as the bridge between very different people", "karma": "Joining and fitting together", "calibration": "mean", "target": {"J": 47, "C": 39, "K": 38, "B": 41, "R": 44, "F": 38}}]},"philosophy":{"version": "1.0", "disclaimer": "This game does not determine real past lives. It is play for philosophical thought experiments and self-reflection, and every character and story is fiction. Scores are only values calculated by the game's rules from the leanings in your answers; they do not fix your personality or beliefs, and they are not the probability of a past life.", "entries": [{"id": "plato", "name": "Plato", "thinkers": "Plato (427–347 BC)", "core": "The soul's pre-existence and recollection", "argument": "In the Meno, Plato argues that learning is 'recollection': the soul remembering what it already knew before birth. In the Phaedo he uses this to argue that the soul existed before the body.", "counter": "Since Aristotle, many philosophers have held that knowledge comes from experience. Familiarity is fully explained by experience and imagination in this life, not memories of a past one.", "game_use": "The 'strangely familiar' feeling in your result story is a narrative device borrowed from the theory of recollection. It is not a claim of real memory.", "references": ["Plato, Meno 81a–86c", "Plato, Phaedo 72e–77a", "Plato, Republic Book 10, the Myth of Er"]}, {"id": "aristotle", "name": "Aristotle's virtue ethics", "thinkers": "Aristotle (384–322 BC)", "core": "Virtue, character and practical wisdom", "argument": "Right action comes from good character rather than rules or calculation. Courage is the mean between recklessness and cowardice, and practical wisdom is the ability to see the mean that fits the situation.", "counter": "Because the mean differs with every situation, virtue ethics is criticised for giving no concrete answer when you actually have to decide.", "game_use": "Used to interpret choices that 'read the situation and find a balance' in the risk-and-sacrifice and bonds-and-loyalty questions.", "references": ["Aristotle, Nicomachean Ethics Book 2 (the mean), Book 3 ch. 6–9 (courage), Book 6 (practical wisdom)"]}, {"id": "utilitarianism", "name": "Bentham and Mill's utilitarianism", "thinkers": "Jeremy Bentham (1748–1832), John Stuart Mill (1806–1873)", "core": "Consequences and the greatest happiness of the greatest number", "argument": "An act is right or wrong according to how much happiness its consequences create and how much suffering they reduce. Everyone's happiness counts equally, as one.", "counter": "It can conclude that the rights of a few may be sacrificed for the benefit of the many. There is also the problem that consequences cannot all be known in advance.", "game_use": "The basis for classing choices that save more people or calculate long-term outcomes as 'judgement by consequences'.", "references": ["Jeremy Bentham, An Introduction to the Principles of Morals and Legislation (1789)", "John Stuart Mill, Utilitarianism (1863)"]}, {"id": "kant", "name": "Kant's ethics of duty", "thinkers": "Immanuel Kant (1724–1804)", "core": "Duty and universal moral principles", "argument": "Right action comes from principle, not consequences. Act on a principle everyone could follow, and never treat a person merely as a means.", "counter": "It doesn't say which to follow when principles clash. Kant's conclusion that you must not lie even to a murderer has been criticised as too rigid.", "game_use": "The basis for classing choices that keep rules and truth even when the outcome is bad as 'judgement by principle and duty'.", "references": ["Immanuel Kant, Groundwork of the Metaphysics of Morals (1785)", "Immanuel Kant, ' ing choices that weigh your own and your family's safety first as 'judgement that protects self and family'. These choices are not penalised.", "references": ["Thomas Hobbes, Leviathan (1651), chapters 13–14", "John Locke, Second Treatise of Government (1689), chapter 19"]}, {"id": "locke", "name": "Locke on personal identity", "thinkers": "John Locke (1632–1704)", "core": "Memory and personal identity", "argument": "Being the same person depends not on the same body or the same soul, but on continuous consciousness — especially memory.", "counter": "Thomas Reid's 'brave officer' counter-example shows one can be the same person even when memory breaks. Memories are also forgotten and distorted.", "game_use": "Supporting material asking whether a past life without memory can really be called 'me'. It is not a claim that the past-life character in this game is the same person as you.", "references": ["John Locke, An Essay Concerning Human Understanding, 2nd ed. (1694), Book 2 ch. 27 'Of Identity and Diversity'", "Thomas Reid, Essays on the Intellectual Powers of Man (1785), Essay 3 ch. 6"]}, {"id": "hume", "name": "Hume's bundle theory of the self", "thinkers": "David Hume (1711–1776)", "core": "Doubt about a fixed self", "argument": "However closely I look within, all I find are perceptions that never stop changing. The 'self' is a bundle of those perceptions; no single fixed self is ever observed.", "counter": "Critics say it cannot explain what binds the perceptions into a 'bundle'. Hume himself admitted in his appendix that he was not satisfied with this account.", "game_use": "The basis for explaining that a score made from twenty answers cannot fix a permanent 'you'. Another day may bring another result.", "references": ["David Hume, A Treatise of Human Nature (1739), Book 1 Part 4 Sect. 6 'Of Personal Identity', and Appendix"]}, {"id": "buddhism", "name": "Buddhist non-self and karma", "thinkers": "Early Buddhist tradition", "core": "A stream of action that continues without a fixed self", "argument": "There is no unchanging self (atman). Yet actions (karma) and their results continue through causes and conditions. The Questions of King Milinda compares this to a flame passed from one lamp to another.", "counter": "A long-standing objection asks, if there is no self, what receives the results of karma. Buddhism itself holds many interpretations of this.", "game_use": "A separate path that rereads your result not as 'who was reborn' but as 'which actions continue'.", "references": ["The Questions of King Milinda (Milindapañha) Book 2, the lamp and chariot similes", "Saṃyutta Nikāya 22:59, the Discourse on the Not-Self Characteristic"]}], "stances": {"util": {"label": "Judgement by consequences", "entry": "utilitarianism"}, "deont": {"label": "Judgement by principle and duty", "entry": "kant"}, "virtue": {"label": "Judgement seeking the right character for the situation", "entry": "aristotle"}, "care": {"label": "Judgement led by relationships and care", "entry": "care_ethics"}, "liberty": {"label": "Judgement valuing autonomy and criticism", "entry": "mill_liberty"}, "self": {"label": "Judgement that protects self and family", "entry": "hobbes"}}, "lenses": {"locke": {"entry": "locke", "text": "In 'The Potion of Forgetting' you put memory at the centre of identity, a choice close to Locke's view. Then can a past life with no memory left be called 'me'? That question is this game's greatest paradox."}, "hume": {"entry": "hume", "text": "In 'The Potion of Forgetting' you chose to keep your memories outside yourself, as a record. You saw the 'self' as a trail of traces rather than one thing in your head — something like Hume's bundle theory."}, "buddhism": {"entry": "buddhism", "text": "In 'The Potion of Forgetting' you chose this present moment over memory. Not clinging to a fixed self echoes the Buddhist idea of non-self."}, "relation": {"entry": "care_ethics", "text": "In 'The Potion of Forgetting' you wanted to keep at least your memories of the people you love. Finding the 'self' in relationships is close to the view of the person in care ethics."}}, "conflicts": [{"id": "community_kin", "a": "community", "b": "kin", "title": "Between duty to the community and personal bonds", "text": "At some moments you put those close to you second for the community's sake; at others you stepped back from the community's demands for family and friends. This game doesn't mark that down as a contradiction. In {name}'s life, too, these two weights never erased each other but stayed together to the end."}, {"id": "principle_outcome", "a": "principle", "b": "outcome", "title": "Between principle and consequences", "text": "In some situations you kept your principles even when the outcome was bad; in others you set them down for a better result. {name} stood in exactly the place where Kant and utilitarianism have argued for centuries."}, {"id": "truth_comfort", "a": "truth", "b": "comfort", "title": "Between truth and comfort", "text": "You believe the truth should be told, yet before certain people you chose comfort over truth. For {name}, too, truth was always right but not always kind."}, {"id": "conscience_obey", "a": "conscience", "b": "obey", "title": "Between conscience and obedience", "text": "You defied some orders and followed others. In {name}'s life, too, the line between how far to obey and where to refuse was drawn anew every time."}, {"id": "risk_caution", "a": "risk", "b": "caution", "title": "Between courage and caution", "text": "At some moments you leapt in without weighing things; at others you stepped back and calculated. Aristotle would say courage lies somewhere in between. {name}, too, felt for that middle ground all life long."}], "caveat_entry": "hume", "karma_entry": "buddhism", "echo_entry": "plato"}};
