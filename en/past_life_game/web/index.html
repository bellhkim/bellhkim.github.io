<script>
// JavaScript port of engine/scoring.py, engine/inference.py and engine/narrative.py.
// tests/test_web_parity.py checks that it gives the same results as the Python engine.
(function (root) {
  "use strict";
  const DIMS = ["J", "C", "K", "B", "R", "F"];
  const dimIndex = (d) => DIMS.indexOf(d);

  function questionMap(Q) {
    const m = {};
    for (const q of Q.questions) m[q.id] = q;
    return m;
  }
  function chosenOption(q, oid) {
    const o = q.options.find((x) => x.id === oid);
    if (!o) throw new Error(q.id + " has no option " + oid);
    return o;
  }
  function rawScores(Q, answers) {
    const qm = questionMap(Q), total = {};
    for (const d of DIMS) total[d] = 0;
    for (const qid of Object.keys(answers)) {
      const o = chosenOption(qm[qid], answers[qid]);
      for (const d of DIMS) total[d] += o.scores[d];
    }
    return total;
  }
  function scoreBounds(Q) {
    const lo = {}, hi = {};
    for (const d of DIMS) { lo[d] = 0; hi[d] = 0; }
    for (const q of Q.questions) {
      for (const d of DIMS) {
        const vals = q.options.map((o) => o.scores[d]);
        lo[d] += Math.min(...vals);
        hi[d] += Math.max(...vals);
      }
    }
    return [lo, hi];
  }
  function normalize(raw, bounds) {
    const [lo, hi] = bounds, out = {};
    for (const d of DIMS) {
      const span = hi[d] - lo[d];
      out[d] = span === 0 ? 0 : ((raw[d] - lo[d]) * 100) / span;
    }
    return out;
  }
  function stanceCounts(Q, answers) {
    const qm = questionMap(Q), c = {};
    for (const qid of Object.keys(answers)) {
      const s = chosenOption(qm[qid], answers[qid]).stance;
      if (s) c[s] = (c[s] || 0) + 1;
    }
    return c;
  }
  function tagHits(Q, answers) {
    const qm = questionMap(Q), hits = {};
    for (const qid of Q.display_order) {
      if (!(qid in answers)) continue;
      for (const t of chosenOption(qm[qid], answers[qid]).tags || []) (hits[t] = hits[t] || []).push(qid);
    }
    return hits;
  }
  function contributions(Q, answers, dim) {
    const qm = questionMap(Q), order = {};
    Q.display_order.forEach((qid, i) => { order[qid] = i; });
    const rows = Object.keys(answers).map((qid) => [qid, answers[qid], chosenOption(qm[qid], answers[qid]).scores[dim]]);
    rows.sort((a, b) => b[2] - a[2] || order[a[0]] - order[b[0]]);
    return rows;
  }

  function distance(p, t, alpha) {
    let s = 0;
    for (const d of DIMS) s += alpha[d] * (p[d] - t[d]) ** 2;
    return Math.sqrt(s);
  }
  function rank(prof, C) {
    const rows = C.characters.map((ch, i) => {
      const dist = distance(prof, ch.target, C.alpha);
      return { id: ch.id, distance: dist, resonance: Math.max(0, 100 - dist), order: i };
    });
    rows.sort((a, b) => a.distance - b.distance || a.order - b.order);
    return rows;
  }
  function coTop(ranked, margin) {
    const best = ranked[0].distance;
    return ranked.filter((r) => r.distance - best < margin).map((r) => r.id);
  }

  function hasBatchim(word) {
    const w = word.trim();
    const code = w.charCodeAt(w.length - 1) - 0xac00;
    return code >= 0 && code <= 11171 && code % 28 !== 0;
  }
  function averageProfile(Q) {
    const [lo, hi] = scoreBounds(Q), out = {};
    for (const d of DIMS) {
      let avg = 0;
      for (const q of Q.questions) avg += q.options.reduce((a, o) => a + o.scores[d], 0) / q.options.length;
      out[d] = ((avg - lo[d]) * 100) / (hi[d] - lo[d]);
    }
    return out;
  }
  const fmt = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

  function buildResult(Q, C, P, answers) {
    const qm = questionMap(Q);
    const dimName = {};
    for (const d of Q.dimensions) dimName[d.id] = d.name;
    const chars = {};
    for (const c of C.characters) chars[c.id] = c;
    const entries = {};
    for (const e of P.entries) entries[e.id] = e;

    const raw = rawScores(Q, answers);
    const prof = normalize(raw, scoreBounds(Q));
    const ranked = rank(prof, C);
    const top = chars[ranked[0].id];
    const name = top.name;

    const byStrength = DIMS.slice().sort((a, b) => prof[b] - prof[a] || dimIndex(a) - dimIndex(b));
    const topDim = byStrength[0], lowDim = byStrength[DIMS.length - 1];
    const lines = C.dimension_lines;
    const personal = [fmt(lines.top[topDim], { name }), fmt(lines.low, { dim: dimName[lowDim] })];

    const hits = tagHits(Q, answers);
    const found = [];
    P.conflicts.forEach((rule, i) => {
      const a = hits[rule.a] || [], b = hits[rule.b] || [];
      if (a.length && b.length) found.push([-(a.length + b.length), i, rule, a[0], b[0]]);
    });
    found.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
    const ev = (qid) => ({ qid, title: qm[qid].title, choice: chosenOption(qm[qid], answers[qid]).text });
    const conflicts = found.slice(0, 2).map(([, , rule, qa, qb]) => ({
      id: rule.id, title: rule.title, text: fmt(rule.text, { name }), evidence: [ev(qa), ev(qb)]
    }));

    const counts = stanceCounts(Q, answers);
    const stanceOrder = Object.keys(P.stances);
    const stances = Object.keys(counts)
      .sort((a, b) => counts[b] - counts[a] || stanceOrder.indexOf(a) - stanceOrder.indexOf(b))
      .slice(0, 2)
      .map((s) => ({ id: s, label: P.stances[s].label, count: counts[s], entry: entries[P.stances[s].entry] }));

    let identity = null;
    for (const q of Q.questions) {
      if (q.theme === "identity" && q.id in answers) {
        const lens = chosenOption(q, answers[q.id]).lens;
        if (lens in P.lenses) {
          identity = { lens, text: P.lenses[lens].text, entry: entries[P.lenses[lens].entry] };
          break;
        }
      }
    }

    const avg = averageProfile(Q);
    let lean = DIMS.slice().sort((a, b) => (top.target[b] - avg[b]) - (top.target[a] - avg[a]) || dimIndex(a) - dimIndex(b));
    if (DIMS.every((d) => Math.abs(top.target[d] - avg[d]) < 1)) lean = byStrength;
    const evidence = lean.slice(0, 2).map((d) => ({
      dim: d, dim_name: dimName[d], score: prof[d],
      answers: contributions(Q, answers, d).filter((r) => r[2] > 0).slice(0, 3)
        .map(([qid, oid, pts]) => ({ qid, title: qm[qid].title, choice: chosenOption(qm[qid], oid).text, points: pts }))
    }));

    const alternatives = ranked.slice(1, 3).map((r) => {
      const alt = chars[r.id];
      let d = DIMS[0], best = -1;
      for (const x of DIMS) {
        const diff = Math.abs(alt.target[x] - top.target[x]);
        if (diff > best) { best = diff; d = x; }
      }
      const more = alt.target[d] > top.target[d];
      return {
        id: alt.id, name: alt.name, resonance: r.resonance,
        why: "Had you valued '" + dimName[d] + "' a little " + (more ? "more" : "less") +
          ", you would have been closer to '" + alt.name + "'."
      };
    });

    const tops = stances.length ? stances[0].label : "balanced judgement";
    const karma = "Read through the lens of karma, what continues is not a self called '" + name +
      "' but a stream of action: '" + top.karma + "'. The judgement that appeared most often in your answers was '" + tops +
      "'. Where that action leads depends on the choices you make from here.";
    const echo = top.plato_echo + ", you might imagine it, in Plato's terms, as a moment of the soul 'recollecting' what it knew long ago. Of course, this is only a storytelling device.";

    return {
      data_version: Q.version, raw, profile: prof, ranking: ranked, co_top: coTop(ranked, C.tie_margin),
      character: top, personal, conflicts, stances, identity,
      caveat: entries[P.caveat_entry], karma, echo, evidence, alternatives, disclaimer: P.disclaimer,
      share: "My past life was 「" + name + "」 — " + top.summary + ". (" + top.era + ", " + top.region + ")"
    };
  }

  const api = { DIMS, rawScores, scoreBounds, normalize, rank, coTop, buildResult };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PastLife = api;
})(this);

</script>

  function dexHTML(newId) {
    const d = dex.get(), n = C.characters.filter((c) => d[c.id]).length;
    if (!n && !newId) return "";
    return '<div class="dex"><h3>Past-life collection <small>' + n + " / " + C.characters.length + (n === C.characters.length ? " · complete! 🎉" : "") + "</small></h3>" +
      '<div class="grid">' + C.characters.map((c) => d[c.id]
        ? '<div class="cell' + (c.id === newId ? " new" : "") + '" title="' + esc(c.summary) + '"><span class="seal" style="background:' + c.color + '">' + esc(c.seal) + "</span>" + esc(c.name) + "</div>"
        : '<div class="cell locked"><span class="seal">?</span>???</div>').join("") + "</div>" +
      (n < C.characters.length ? '<p class="small">Answer again on another day, in another mood, and you may meet another past life.</p>' : "") + "</div>";
  }

  function pastHTML() {
    const chars = Object.fromEntries(C.characters.map((c) => [c.id, c]));
    const list = saved.list().filter((x) => chars[x.id] && decode(x.code)).slice(0, 5);
    if (!list.length) return "";
    return '<div class="history"><h3>Past results</h3>' + list.map((x) => {
      const c = chars[x.id];
      return '<button class="hist" data-code="' + x.code + '"><span class="seal" style="background:' + c.color + '">' + esc(c.seal) + "</span><span>" + esc(c.name) + "<small>" + fmtDate(x.at) + "</small></span></button>";
    }).join("") + "</div>";
  }

  function question() {
    const q = order[idx];
    app.innerHTML =
      '<div class="qhead"><span>Question ' + String(idx + 1).padStart(2, "0") + " · " + esc(Q.themes[q.theme]) + "</span><span>" + (idx + 1) + " / " + order.length + "</span></div>" +
      '<div class="progress"><i style="width:' + (idx / order.length) * 100 + '%"></i></div>' +
      '<div class="fade"><div class="qcard"><h2>' + esc(q.title) + '</h2><p class="situation">' + esc(q.situation) + '</p><div class="small">' + esc(q.prompt) + "</div></div>" +
      '<div class="options" role="group" aria-label="Choices">' +
      q.options.map((o) => '<button class="opt' + (answers[q.id] === o.id ? " on" : "") + '" data-o="' + o.id + '"><b>' + o.id + "</b><span>" + esc(o.text) + "</span></button>").join("") +
      "</div>" +
      '<div class="qnav">' + (idx > 0 ? '<button class="linkbtn" id="back">← Previous</button>' : "<span></span>") + '<button class="linkbtn" id="home">✕ Quit</button></div></div>';
    app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      answers[q.id] = b.dataset.o;
      store.set("pl_answers", answers);
      app.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === b));
      setTimeout(() => {
        if (idx + 1 < order.length) { idx++; question(); }
        else reveal();
      }, 220);
    }));
    const back = document.getElementById("back");
    if (back) back.onclick = () => { idx--; question(); };
    document.getElementById("home").onclick = () => { if (window.appShell) appShell.exit(); intro(); askFeedback(); };
    window.scrollTo(0, 0);
    const first = app.querySelector(".opt.on") || app.querySelector(".opt");
    if (first) first.focus({ preventScroll: true });
  }

  function radarSVG(prof, target) {
    const cx = 160, cy = 150, R = 110;
    const pt = (i, v) => {
      const a = -Math.PI / 2 + (i * Math.PI) / 3;
      return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100];
    };
    const poly = (vals) => vals.map((v, i) => pt(i, v).map((n) => n.toFixed(1)).join(",")).join(" ");
    let s = '<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="Hexagon chart of your judgement profile">';
    for (const lv of [25, 50, 75, 100]) s += '<polygon points="' + poly(Array(6).fill(lv)) + '" fill="none" stroke="#3a3448" stroke-width="1"/>';
    E.DIMS.forEach((d, i) => {
      const [x, y] = pt(i, 100), [lx, ly] = pt(i, 122);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#3a3448"/>';
      const name = Q.dimensions[i].name.split("and ")[0].split("and ")[0];
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" fill="#efe6d2" font-size="13" text-anchor="middle" font-family="Gowun Batang, serif">' + esc(name) + "</text>";
    });
    s += '<polygon points="' + poly(E.DIMS.map((d) => target[d])) + '" fill="rgba(143,134,168,0.15)" stroke="#b9b0d0" stroke-width="1.5" stroke-dasharray="4 3"/>';
    s += '<polygon points="' + poly(E.DIMS.map((d) => prof[d])) + '" fill="rgba(217,180,91,0.28)" stroke="#d9b45b" stroke-width="2.5"/>';
    E.DIMS.forEach((d, i) => { const [x, y] = pt(i, prof[d]); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="#d9b45b"/>'; });
    return s + "</svg>";
  }

  function entryHTML(e) {
    return "<p><b>Core idea</b> · " + esc(e.core) + "</p><p><b>Argument</b> · " + esc(e.argument) + "</p><p><b>Objection</b> · " + esc(e.counter) + "</p><p><b>How this game uses it</b> · " + esc(e.game_use) + '</p><p class="refs">References: ' + e.references.map(esc).join(" / ") + "</p>";
  }

  // the wheel of lives spins, slows, and one seal stamps down with a gong
  function reveal() {
    const r = E.buildResult(Q, C, P, answers), ch = r.character;
    const lines = ["Twenty choices gathered", "Reading your judgement along six lines…", "Long, long ago, " + ch.era + "…", ch.region + ", one day"];
    app.innerHTML = '<div class="reveal fade"><div class="wheel"><span class="ring"></span><span class="seal" id="spin"></span></div>' +
      '<div class="line" id="rvLine"></div><div class="sub" id="rvSub"></div><button class="skip" id="rvSkip">Skip</button></div>';
    window.scrollTo(0, 0);
    let done = false, timer = 0;
    const finish = () => { if (done) return; done = true; clearTimeout(timer); result(); };
    document.getElementById("rvSkip").onclick = finish;
    const spin = document.getElementById("spin"), cs = C.characters;
    let i = 0, delay = 60, t = 0;
    const step = () => {
      if (done) return;
      const c = cs[i++ % cs.length];
      spin.style.background = c.color; spin.textContent = c.seal;
      note(420 + (i % 6) * 70, 0, 0.06, "triangle", 0.03);
      t += delay;
      const li = Math.min(lines.length - 1, Math.floor(t / 900));
      const lineEl = document.getElementById("rvLine");
      if (lineEl && lineEl.dataset.i !== String(li)) { lineEl.dataset.i = li; lineEl.textContent = lines[li]; lineEl.style.animation = "none"; void lineEl.offsetWidth; lineEl.style.animation = ""; }
      if (t < 3200) { delay = Math.min(380, delay * 1.09); timer = setTimeout(step, delay); return; }
      // stamp
      spin.className = "seal final"; spin.style.background = ch.color; spin.textContent = ch.seal;
      document.getElementById("rvLine").textContent = "Your past life was…";
      document.getElementById("rvSub").textContent = "「" + ch.name + "」";
      gong();
      if (navigator.vibrate) try { navigator.vibrate([30, 60, 120]); } catch (e) {}
      timer = setTimeout(finish, 1900);
    };
    step();
  }

  // match: two judgement profiles, closer = higher
  function matchHTML(r, ch, chars, f) {
    const fa = decode(f.code);
    const fr = E.buildResult(Q, C, P, fa), fc = fr.character;
    const diffs = E.DIMS.map((d, i) => ({ name: Q.dimensions[i].name, gap: Math.abs(r.profile[d] - fr.profile[d]), both: (r.profile[d] + fr.profile[d]) / 2 }));
    const dist = Math.sqrt(diffs.reduce((a, x) => a + x.gap * x.gap, 0));
    const pct = Math.max(20, Math.min(99, Math.round(100 - dist * 0.8)));
    const same = diffs.slice().sort((a, b) => a.gap - b.gap || b.both - a.both)[0], apart = diffs.slice().sort((a, b) => b.gap - a.gap)[0];
    const kind = pct >= 85 ? ["💛 Soulmates", "You’d have lived side by side in the same age, trusting each other with your backs."]
      : pct >= 70 ? ["🤝 Old friends who knew each other", "You could guess each other’s choices without a word."]
      : pct >= 55 ? ["⚔️ Bickering rivals", "You clash often — and that is what made each of you stronger."]
      : ["🌗 Opposites who attract", "Each has what the other lacks, so you keep looking each other’s way."];
    const sameChar = fc.id === ch.id;
    const story = sameChar
      ? "You’re both 「" + ch.name + "」! Two people who lived the same life, meeting again."
      : "「" + fc.name + "」(" + fc.era + ") × 「" + ch.name + "」(" + ch.era + ") meet. " + kind[1];
    return { pct, fc, html: '<section class="block match"><h2>💞 Past-life match with your friend</h2>' +
      '<div class="pair"><div class="who"><span class="seal" style="background:' + fc.color + '">' + esc(fc.seal) + "</span><b>" + esc(fc.name) + "</b> Friend’s past life</div>" +
      '<span class="heart" aria-hidden="true">💗</span>' +
      '<div class="who"><span class="seal" style="background:' + ch.color + '">' + esc(ch.seal) + "</span><b>" + esc(ch.name) + "</b> My past life</div></div>" +
      '<div class="pct">' + pct + '%</div><div class="kind">' + kind[0] + "</div>" +
      "<p>" + esc(story) + "</p>" +
      "<p>You two are most alike in <b>" + esc(same.name) + "</b>, and most different in <b>" + esc(apart.name) + "</b> (gap " + Math.round(apart.gap) + ").</p>" +
      '<p class="small">The match is a just-for-fun score based on how close your two judgement profiles are.</p>' +
      '<button class="btn" id="matchShare">Send the match to your friend</button></section>' };
  }

  // from: "play" (just finished), "link" (opened from a shared link) or "saved" (from the list of past results)
  function result(from = "play") {
    const r = E.buildResult(Q, C, P, answers);
    const ch = r.character;
    const chars = Object.fromEntries(C.characters.map((c) => [c.id, c]));
    const code = encode(answers);
    let isNewLife = false;
    if (from === "play") { saved.add(code, ch); store.set("pl_answers", {}); isNewLife = dex.add(ch.id); }
    if (from === "link") friend.set(code);
    const fr = from === "play" ? friend.get() : null;
    const match = fr && fr.code !== code ? matchHTML(r, ch, chars, fr) : null;
    if (location.hash !== "#r-" + code) location.hash = "r-" + code;
    const blocks = [];
    if (from === "link") blocks.push('<div class="linkbanner"><span>This is a friend’s past-life result. Take the test to see your <b>past-life match</b> with them!</span><button class="btn" id="tryBtn">Take the test and see our match</button></div>');
    blocks.push(
      '<div class="eyebrow">Imagined person · imagined life · a philosophical inference</div>' +
      '<div class="hero"><div class="seal" style="background:' + ch.color + '">' + esc(ch.seal) + '</div><div><div class="small">Your past life was</div><h1>' + esc(ch.name) + " " + ch.emoji + '</h1><div class="meta">' + esc(ch.era) + " · " + esc(ch.region) + '</div><div class="meta">' + esc(ch.occupation) + "</div></div></div>" +
      (r.co_top.length > 1 ? '<div class="cotop">Your judgement profile is almost as close to ' + r.co_top.slice(1).map((id) => "'" + esc(chars[id].name) + "'").join(", ") + "too. Two lives overlap in this result.</div>" : "") +
      '<div class="quote">“' + esc(ch.quote) + "”</div>" +
      (isNewLife ? '<div class="dexnote">📖 New life added to your collection! (' + Object.keys(dex.get()).length + " / " + C.characters.length + ")</div>" : "")
    );
    if (match) blocks.push(match.html);
    blocks.push('<section class="block"><h2>Your past-life story</h2><div class="story">' + ch.story.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div>" +
      '<div class="facts"><div class="fact"><span>Way of life</span><span>' + esc(ch.life) + '</span></div><div class="fact"><span>Turning point</span><span>' + esc(ch.key_event) + '</span></div><div class="fact"><span>Inner conflict</span><span>' + esc(ch.conflict) + "</span></div></div>" +
      '<div class="personal" style="margin-top:16px">' + r.personal.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div></section>");
    if (r.conflicts.length) {
      blocks.push('<section class="block"><h2>Tensions between your choices <small>read as inner conflict, not as a penalty</small></h2>' +
        r.conflicts.map((c) => '<div class="conflict"><h3>' + esc(c.title) + "</h3><div>" + esc(c.text) + '</div><div class="ev">' + c.evidence.map((e) => "「" + esc(e.title) + "」 " + esc(e.choice)).join(" ↔ ") + "</div></div>").join("") + "</section>");
    }
    blocks.push('<section class="block"><h2>Judgement profile</h2><div class="profile"><div>' + radarSVG(r.profile, ch.target) +
      '<div class="legend"><span style="--c:#d9b45b">My answers</span><span style="--c:#b9b0d0">' + esc(ch.name) + ' baseline</span></div></div><div class="bars">' +
      Q.dimensions.map((d) => '<div class="bar"><div class="top"><span>' + esc(d.name) + "</span><span>" + Math.round(r.profile[d.id]) + '</span></div><div class="track"><i style="width:' + r.profile[d.id] + '%"></i><em style="left:' + ch.target[d.id] + '%"></em></div></div>').join("") +
      '</div></div><p class="small">0–100 is your position between the lowest and highest totals possible in this game’s questions. The vertical line on each bar is the character’s baseline. It is not an absolute measure of any psychological trait.</p></section>');
    blocks.push('<section class="block"><h2>Philosophical reading</h2><p class="disclaimer" style="margin-bottom:12px">' + esc(r.disclaimer) + "</p>" +
      r.stances.map((s, i) => "<details" + (i === 0 ? " open" : "") + "><summary>" + esc(s.label) + " · " + s.count + " times</summary><div class=\"inner\"><p>Of your answers, " + s.count + "were classed this way. The related thinking is <b>" + esc(s.entry.name) + "</b>. That doesn’t mean you follow this philosophy.</p>" + entryHTML(s.entry) + "</div></details>").join("") +
      (r.identity ? "<details><summary>Memory and identity</summary><div class=\"inner\"><p>" + esc(r.identity.text) + "</p>" + entryHTML(r.identity.entry) + "</div></details>" : "") +
      "<details><summary>Reread through karma</summary><div class=\"inner\"><p>" + esc(r.karma) + "</p></div></details>" +
      "<details><summary>If it feels strangely familiar</summary><div class=\"inner\"><p>" + esc(r.echo) + "</p></div></details>" +
      "<details><summary>Can you trust this result?</summary><div class=\"inner\"><p>A score made from twenty answers cannot pin down a fixed 'you'. Answer on another day, in another mood, and another character may appear.</p>" + entryHTML(r.caveat) + "</div></details></section>");
    blocks.push('<section class="block evidence"><h2>Evidence</h2>' + r.evidence.map((ev) => "<h3>" + esc(ev.dim_name) + " " + Math.round(ev.score) + ' <span class="small">— \'' + esc(ch.name) + "'’s defining trait</span></h3>" +
      (ev.answers.length ? "<ul>" + ev.answers.map((a) => "<li>「" + esc(a.title) + "」 " + esc(a.choice) + ' <span class="small">(+' + a.points + ")</span></li>").join("") + "</ul>" : '<p class="small">None of your answers added points here.</p>')).join("") + "</section>");
    const bar = (nm, res) => '<div class="top"><span>' + esc(nm) + "</span><span>closeness " + Math.round(res) + '</span></div><div class="track"><i style="width:' + res + '%"></i></div>';
    blocks.push('<section class="block"><h2>Other possibilities</h2><div class="alt">' + bar(ch.name, r.ranking[0].resonance) + "</div>" +
      r.alternatives.map((a) => '<div class="alt">' + bar(a.name, a.resonance) + '<div class="small">' + esc(a.why) + "</div></div>").join("") +
      '<p class="small">Closeness is 100 minus the distance between judgement profiles. It is not the probability of a past life.</p></section>');
    blocks.push('<section class="block"><h2>Share card</h2><div class="share"><div class="seal" style="background:' + ch.color + '">' + esc(ch.seal) + '</div><div class="small">Who Was I</div><h3>' + esc(ch.name) + '</h3><div class="quote" style="margin:4px 0 6px;font-size:20px">' + esc(ch.summary) + '</div><div class="small">' + esc(ch.era) + " · Who Was I in a Past Life?</div></div>" +
      '<div class="actions">' + (from === "play" ? '<button class="btn lucky" id="luckyBtn">🍀 Test-complete bonus · open a lucky card</button>' : "") + '<button class="btn kakao" id="meBtn">Send to myself (save result)</button><button class="btn" id="shareBtn">Recommend this test to a friend</button><textarea class="share-text" id="shareText" rows="5" readonly hidden></textarea><button class="btn ghost" id="again">' + (from === "link" ? "Take the test" : "Start over") + "</button></div>" +
      '<p class="small">Your result is also saved on this device under \'Past results\' on the first screen. The result link you send opens the same result on any device. Shared messages never include personal details like your name or contacts.</p></section>');
    if (from !== "link") blocks.push('<section class="block">' + dexHTML(isNewLife ? ch.id : null) + "</section>");
    app.innerHTML = '<div class="fade">' + blocks.join("") + "</div>";
    window.scrollTo(0, 0);
    const restart = () => { if (window.appShell) appShell.exit(); answers = {}; store.set("pl_answers", answers); intro(); askFeedback(); };
    document.getElementById("again").onclick = restart;
    const tryBtn = document.getElementById("tryBtn");
    if (tryBtn) tryBtn.onclick = restart;
    const link = resultUrl(answers);
    document.getElementById("meBtn").onclick = () => share(
      "📜 [My past-life result · " + fmtDate(Date.now()) + "]\n" +
      "My past life was 「" + ch.name + "」 " + ch.emoji + "\n" + ch.summary + " (" + ch.era + ", " + ch.region + ")\n" +
      "“" + ch.quote + "”\n\nSee the result again 👉 " + link,
      "Copied! Paste it into your 'notes-to-self chat'to keep your result");
    document.getElementById("shareBtn").onclick = () => share(
      "🔮 My past life was 「" + ch.name + "」 " + ch.emoji + "!\n" + ch.summary + " (" + ch.era + ")\n\n" +
      "A past-life test from twenty philosophical dilemmas: 「Who Was I in a Past Life?」\n" +
      "It takes 5 minutes. Open my result link below and take the test to see our past-life match 👇\n" + link,
      "Copied! Send it to a friend");
    const ms = document.getElementById("matchShare");
    if (ms) ms.onclick = () => share(
      "💞 Our past-life match: " + match.pct + "%!\nMy friend’s past life 「" + match.fc.name + "」 × mine 「" + ch.name + "」\n\n" +
      "My past-life result 👉 " + link + "\nTry a match with another friend 👉 " + testUrl(),
      "Copied! Send it to a friend");
    const luckyBtn = document.getElementById("luckyBtn");
    if (luckyBtn && window.luckyCard) luckyBtn.onclick = () => { window.luckyCard.open({ game: "Who Was I in a Past Life?", reason: "Test complete · past life: " + ch.name }); luckyBtn.remove(); };
    else if (luckyBtn) luckyBtn.remove();
    if (from === "play") { testsDone++; lastName = ch.name; }
  }

  // feedback: once per visit, when the player leaves after finishing the test at least once
  let testsDone = 0, lastName = "";
  const feedbackOpts = () => testsDone ? { game: "Who Was I in a Past Life?", context: testsDone + " done · last result: " + lastName, accent: "#d9b45b", ink: "#241a05" } : null;
  const askFeedback = () => { if (window.gameFeedback) gameFeedback.askOnce(feedbackOpts()); };
  if (window.gameFeedback) gameFeedback.onLeave(feedbackOpts);

  let toastTimer = 0;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }
  function share(text, copiedMsg) {
    const fallback = () => {
      const ta = document.getElementById("shareText");
      ta.value = text; ta.hidden = false; ta.focus(); ta.select();
      toast("Long-press the text to copy it, then paste it into a chat");
    };
    const copy = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(copiedMsg || "Copied! Paste it into a chat")).catch(fallback);
      else fallback();
    };
    if (navigator.share) navigator.share({ title: "Who Was I in a Past Life?", text }).catch((err) => { if (!err || err.name !== "AbortError") copy(); });
    else copy();
  }

  // used by automated tests
  window.__pl = { answer: (a) => { answers = a; result(); }, reveal: (a) => { answers = a; reveal(); }, encode: (a) => encode(a) };
  // a #r-… link opens that result; our own hash updates (same result) are ignored
  function route(initial) {
    const m = /^#r-([ABCD]{20})$/.exec(location.hash);
    const a = m && decode(m[1]);
    if (!a) return false;
    if (initial || encode(answers) !== m[1]) { answers = a; result("link"); }
    return true;
  }
  window.addEventListener("hashchange", () => route(false));
  if (!route(true)) intro();
})();
</script>

  border-radius: 12px; padding: 13px 10px;
  font: 400 18px "Black Han Sans", "Jua", "Apple SD Gothic Neo", sans-serif;
}
.fb-later { background: #eee8f2; color: #2b2233; }
.fb-send { background: var(--fb-accent); color: var(--fb-ink); }
.fb-send:disabled { opacity: 0.45; cursor: default; }
.fb-chip:focus-visible, .fb-btn:focus-visible, .fb-card textarea:focus-visible { outline: 3px solid #7c5cff; outline-offset: 2px; }
</style>
<script>
// Ask the player what the maker should change. Games call askOnce() when the player leaves
// (once per visit, after at least one finished game). Feedback reaches the maker through
// KakaoTalk: the phone's share sheet when the page may open it, otherwise the
// message is copied for the player to paste into the chat the game link came from.
window.gameFeedback = (() => {
  const MAKER = "Kim Jonghyun";
  const OPTIONS = ["😄 It’s fun", "😵 Too hard", "😴 Too easy", "🐞 Found a bug", "✨ Please add a feature", "🎨 Change the design", "📱 The screen is awkward"];

  async function deliver(text) {
    if (navigator.share) {
      try { await navigator.share({ text }); return "shared"; }
      catch (e) { if (e && e.name === "AbortError") return "aborted"; }
    }
    try { await navigator.clipboard.writeText(text); return "copied"; } catch (e) {}
    return "manual";
  }

  function open({ game, context = "", accent = "#ff5d8f", ink = "#ffffff" }) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const ov = document.createElement("div");
      ov.className = "fb-overlay";
      ov.style.setProperty("--fb-accent", accent);
      ov.style.setProperty("--fb-ink", ink);
      ov.setAttribute("role", "dialog");
      ov.setAttribute("aria-modal", "true");
      ov.setAttribute("aria-label", MAKER + " — send feedback");
      const card = document.createElement("div");
      card.className = "fb-card";
      ov.appendChild(card);
      document.body.appendChild(ov);
      const close = (sent) => {
        ov.remove();
        document.removeEventListener("keydown", onKey, true);
        if (prevFocus && prevFocus.focus) try { prevFocus.focus({ preventScroll: true }); } catch (e) {}
        resolve(sent);
      };
      const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(false); } };
      document.addEventListener("keydown", onKey, true);

      function form(picked = [], memo = "") {
        card.innerHTML =
          "<h3>A word for the maker, " + MAKER + "</h3>" +
          "<p>How was the game? Pick anything you’d like changed — as many as you like.</p>" +
          '<div class="fb-chips">' + OPTIONS.map((o) => '<button type="button" class="fb-chip" aria-pressed="' + picked.includes(o) + '">' + o + "</button>").join("") + "</div>" +
          '<textarea id="fbMemo" rows="3" maxlength="500" placeholder="Write any wishes or features you’d like (optional)"></textarea>' +
          '<div class="fb-btns"><button type="button" class="fb-btn fb-later">Maybe later</button><button type="button" class="fb-btn fb-send">Send</button></div>';
        const memoEl = card.querySelector("#fbMemo");
        memoEl.value = memo;
        const send = card.querySelector(".fb-send");
        const chosen = () => [...card.querySelectorAll('.fb-chip[aria-pressed="true"]')].map((b) => b.textContent);
        const sync = () => { send.disabled = !chosen().length && !memoEl.value.trim(); };
        card.querySelectorAll(".fb-chip").forEach((b) => b.addEventListener("click", () => {
          b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
          sync();
        }));
        memoEl.addEventListener("input", sync);
        sync();
        card.querySelector(".fb-later").addEventListener("click", () => close(false));
        send.addEventListener("click", async () => {
          const sel = chosen(), memo = memoEl.value.trim();
          const text = "[" + game + " feedback] To " + MAKER + "\n" +
            (sel.length ? "• " + sel.join("\n• ") + "\n" : "") +
            (memo ? "💬 " + memo + "\n" : "") +
            (context ? "(" + context + ")" : "");
          send.disabled = true;
          const how = await deliver(text.trim());
          if (how === "aborted") { form(sel, memo); return; }
          done(how, text.trim());
        });
        card.querySelector(".fb-chip").focus({ preventScroll: true });
      }

      function done(how, text) {
        const msg = how === "shared"
          ? "Thank you! " + MAKER + " will use your feedback for the next version."
          : how === "copied"
            ? "Feedback copied. Paste it into your chat with " + MAKER + ", who sent you this game."
            : "Long-press the text below to copy it, then send it to " + MAKER + ", who sent you this game.";
        card.innerHTML = "<h3>" + (how === "shared" ? "Sent!" : "Almost done!") + "</h3><p>" + msg + "</p>" +
          '<textarea readonly rows="5"></textarea>' +
          '<div class="fb-btns"><button type="button" class="fb-btn fb-send">Close</button></div>';
        const ta = card.querySelector("textarea");
        ta.value = text;
        if (how === "manual") { ta.focus(); ta.select(); }
        const btn = card.querySelector(".fb-send");
        btn.addEventListener("click", () => close(true));
        if (how !== "manual") btn.focus({ preventScroll: true });
      }

      form();
    });
  }

  // Once per visit and game: ask when the player leaves after finishing at least one game.
  const memo = {};
  function asked(game) {
    if (memo[game]) return true;
    try { return sessionStorage.getItem("fb_asked:" + game) === "1"; } catch (e) { return false; }
  }
  function askOnce(opts) {
    if (!opts || asked(opts.game) || document.querySelector(".fb-overlay")) return Promise.resolve(false);
    memo[opts.game] = true;
    try { sessionStorage.setItem("fb_asked:" + opts.game, "1"); } catch (e) {}
    return open(opts);
  }
  // On a computer, leaving starts with the pointer going off the top of the window (to the tab's close button).
  // getOpts returns the popup options, or null when it is not a good moment.
  function onLeave(getOpts) {
    document.addEventListener("mouseout", (e) => {
      if (e.relatedTarget || e.clientY > 0) return;
      const opts = getOpts();
      if (opts) askOnce(opts);
    });
  }
  return { open, askOnce, onLeave };
})();
</script>

<script>
// Browsers never let a page remove the address bar itself. Full screen mode hides it where the
// browser allows it (computers, Android Chrome, KakaoTalk on Android); iPhone Safari does not.
window.appShell = (() => {
  const el = document.documentElement;
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  // call from a tap (browsers only allow full screen right after a user gesture)
  function enter() {
    if (isFull()) return;
    try {
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function exit() {
    if (!isFull()) return;
    try {
      const p = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen && document.webkitExitFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  // leave the game altogether: back to the page or chat the link was opened from
  function leaveApp() {
    exit();
    const close = () => {
      if (/KAKAOTALK/i.test(navigator.userAgent)) location.href = "kakaotalk://inappbrowser/close";
      else { try { window.close(); } catch (e) {} }
    };
    if (history.length > 1) {
      history.back();
      setTimeout(() => { if (!document.hidden) close(); }, 500);
    } else close();
  }
  return { enter, exit, isFull, leaveApp };
})();
</script>

<style>

.lk-ball.c1 { background: #f2b500; } .lk-ball.c2 { background: #4fb3e8; } .lk-ball.c3 { background: #f25f5f; } .lk-ball.c4 { background: #9a9a9a; } .lk-ball.c5 { background: #8cc63f; }

.lk-text { width: 100%; box-sizing: border-box; min-height: 120px; resize: none; border: 1.5px solid #e6d3a6; border-radius: 12px; padding: 8px 10px;
  font: 13px/1.5 "Gowun Dodum", sans-serif; color: #3a2400; background: #fff; user-select: text; -webkit-user-select: text; }

<script>
// lucky card: lotto/predict.json holds this week's numbers, rebuilt every Saturday from past draws.
window.luckyCard = (() => {
  const URL_ = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)
    ? new URL("/lotto/predict.json", location.href).href : "https://bellhkim.github.io/lotto/predict.json";
  // the English pages show the English names the weekly job writes next to the Korean ones
  const EN = document.documentElement.lang === "en";
  const tx = (o, k) => (EN && o[k + "_en"]) || o[k];
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  async function load() {
    try {
      const r = await fetch(URL_, { cache: "no-cache" });
      if (!r.ok) return null;
      const p = await r.json();
      return p && p.main && p.main.nums && p.main.nums.length === 6 ? p : null;
    } catch (e) { return null; }
  }
  let actx = null;
  function ding(i) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + i * 0.35, o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.setValueAtTime(660 + i * 90, t);
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  }
  // game: name for the copy text; reason: why the card was earned (e.g. "12,340 points")
  function open({ game, reason, muted = false }) {
    if (document.querySelector(".lk-overlay")) return;
    const ov = document.createElement("div");
    ov.className = "lk-overlay";
    ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Lucky bonus card");
    ov.innerHTML = '<div class="lk-card"><h3>🍀 Lucky bonus card</h3><p>' + esc(reason) + "! Here are this week’s lucky numbers from Dr. Kejay.</p>" +
      '<button type="button" class="lk-reveal">Open the card<small>Tap to see your numbers</small></button></div>';
    document.body.appendChild(ov);
    const card = ov.querySelector(".lk-card"), reveal = ov.querySelector(".lk-reveal");
    const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
    document.addEventListener("keydown", onKey, true);
    reveal.focus({ preventScroll: true });
    reveal.addEventListener("click", async () => {
      reveal.disabled = true;
      reveal.querySelector("small").textContent = "Analysing past winning numbers…";
      const p = await load();
      let nums, bonus, head, foot;
      if (p) {
        nums = p.main.nums; bonus = p.main.bonus;
        head = "Draw #" + p.target.no + " (" + p.target.date.slice(5).replace("-", "/") + ") · " + esc(tx(p.main, "name"));
        foot = '<p class="lk-note">' + esc(tx(p.main, "method")) + "</p>" +
          '<details class="lk-sets"><summary>See the other analyses</summary>' +
          p.sets.map((s) => '<div class="lk-set"><b>' + esc(tx(s, "name")) + "</b><span>" + s.nums.join(" · ") + "</span><small>" + esc(tx(s, "method")) + "</small></div>").join("") +
          "</details>" + '<p class="lk-note">' + esc(tx(p, "note")) + "</p>";
      } else {
        const pool = Array.from({ length: 45 }, (_, i) => i + 1);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        nums = pool.slice(0, 6).sort((a, b) => a - b); bonus = pool[6];
        head = "Lucky numbers from Dr. Kejay";
        foot = '<p class="lk-note">Couldn’t load the analysis, so these are random. Just for fun.</p>';
      }
      const ball = (n, i) => '<span class="lk-ball c' + Math.min(5, Math.ceil(n / 10)) + '" style="animation-delay:' + i * 0.35 + 's">' + n + "</span>";
      card.innerHTML = "<h3>🍀 " + head + "</h3>" +
        '<div class="lk-balls">' + nums.map(ball).join("") + '<span class="lk-plus">+</span>' + ball(bonus, 6) + "</div>" + foot +
        '<textarea class="lk-text" readonly hidden></textarea>' +
        '<div class="lk-btns"><button type="button" class="lk-btn lk-close">Close</button><button type="button" class="lk-btn lk-copy">Copy all numbers</button></div>';
      if (!muted) for (let i = 0; i < 7; i++) ding(i);
      try {
        const list = JSON.parse(localStorage.getItem("lucky_history") || "[]");
        list.unshift({ game, nums, bonus, draw: p ? p.target.no : null, at: Date.now() });
        localStorage.setItem("lucky_history", JSON.stringify(list.slice(0, 10)));
      } catch (e) {}
      // every set on the card goes into the copy, one per line
      const site = (/^https?:$/.test(location.protocol) && !/claude/.test(location.hostname) ? location.origin + "/" : "https://bellhkim.github.io/") + (EN ? "en/" : "");
      const lines = ["🍀 " + game + " " + reason + " — " + (p ? "Draw #" + p.target.no + " (" + p.target.date + ") " : "") + "lucky numbers",
        "⭐ " + (p ? tx(p.main, "name") : "lucky numbers") + ": " + nums.join(", ") + " + bonus " + bonus];
      if (p) for (const s of p.sets) lines.push("• " + tx(s, "name") + ": " + s.nums.join(", ") + (s.bonus ? " + bonus " + s.bonus : ""));
      lines.push("(Numbers from a just-for-fun analysis of past draws. Every combination has the same odds.)", site);
      const text = lines.join("\n");
      card.querySelector(".lk-close").addEventListener("click", close);
      const copyBtn = card.querySelector(".lk-copy");
      const ta = card.querySelector(".lk-text");
      copyBtn.addEventListener("click", () => {
        const manual = () => { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); copyBtn.textContent = "Long-press to copy"; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { copyBtn.textContent = "All copied!"; }).catch(manual);
        else manual();
      });
      copyBtn.focus({ preventScroll: true });
    });
  }
  return { open };
})();
</script>
