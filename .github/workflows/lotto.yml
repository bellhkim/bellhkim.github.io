# Weekly lotto data for the 고스톱 lucky card (copied to .github/workflows/ of the public site).
# Saturday's draw is at about 20:35 KST; run late Saturday night and again Sunday morning in case the
# results were late. Run it by hand from the Actions tab to backfill or refresh.
name: lotto weekly update
on:
  schedule:
    - cron: "17 14 * * 6"   # Saturday 23:17 KST
    - cron: "17 0 * * 0"    # Sunday 09:17 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotto
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new draws and rebuild this week's numbers
        run: python3 -u tools/lotto_update.py .
      - name: Save
        run: |
          git config user.name "lotto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto/draws.json lotto/predict.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "lotto: update to draw $(python3 -c 'import json;print(json.load(open("lotto/predict.json"))["basedOn"]["no"])')"
          git push
